en:{kicker:"Manifesto · 2025",title:"Escape",sub:"High-dimensional space for twenty-first-century architecture",
 meta:[["Year","2025"],["Type","Manifesto"],["Context","Master of Architecture, University of Melbourne"],["Authorship","Individual"]],
 bibH:"Bibliography",notesPart:"Notes",
 ch:[
 {part:"Intro",h:"A torn age",b:[
  {p:"We live in a torn age.",lead:true},
  {p:"Our minds wander at the speed of light through virtual socialising, working and entertaining ourselves in the clouds. Yet our bodies are confined within static containers made of concrete, glass and steel.",drop:true},
  {p:"Technology is the core driver of architectural evolution, yet architecture is also one of the slowest industries to adopt innovation. Let us not forget that we have already entered an era of digital explosion led by artificial intelligence. In construction technology, the Burj Khalifa and rapid urbanisation have pushed artificial structures to unprecedented heights, while parametric design has gradually devolved into a cycle of formal introspection. Meanwhile, the vision of the metaverse has faltered due to its emptiness and anti-human nature."},
  {p:"All these points lead to the same core contradiction: a deepening chasm exists between our souls and the static built environment designed for our physical bodies. Architecture is trapped in a three-dimensional prison of its own making."},
  {p:"Architecture must align with digital transformation, abandoning its traditional role as a static object and embracing a new identity as an interactive, adaptive system. It should be conceived as a high-dimensional interface, leveraging the potential of digital information and merging it with physical reality to deepen our control over the spatial environment, and ultimately revolutionise human activity and sensory experience."},
  {p:"We stand at a critical juncture. The time has come to initiate a radical paradigm shift, courageously."},
  {p:"We declare that architecture must cease constructing endpoints. We urgently need to initiate a great “Dimensional Escape”, transcending the role of passive “container” and actively evolving into a dynamic “interface.”",strong:true}]},
 {part:"Space as a container",h:"Locked in 3D",b:[
  {h3:"1D · The unmediated body"},
  {fig:"img/m-1d.jpg",small:true},
  {p:"1D architecture represents a reactive extreme. It does not shape internal life but responds only in the most instinctive, one-dimensional manner to external natural forces: rain, wind, wild animals. Its sole vector is “survival.” Like the allegorical engraving of the Vitruvian primitive hut[[1]], it is a point without programme: you know you can pause and rest here, confronting the natural environment at a single point, a moment of suspension. Whether a primitive shelter from the era of Homo erectus or a bomb shelter in modern society, when a nuclear explosion strikes, it regresses into a purely 1D object[[2]]. It only needs to be sturdy. This is not about the style of “primitive architecture”[[3]] but about the most fundamental, de-socialised essence of all architecture."},
  {h3:"2D · The plan of order"},
  {fig:"img/m-2d.jpg",small:true},
  {p:"When multiple primary entities emerge from human productive activities and come together, they form the most primitive architectural assemblies. We can define their projected diagram as 2D architecture. It inscribes rules through the plan (axis, sequence, size, orientation, hierarchy), dictating human movement, gaze and interaction within one 1D space after another. From a simple bedroom and the Pantheon in Rome to a village structured like a residence, all embody this configurative discipline[[4]]. This is not limited to Gothic or Classical styles; any space that solidifies power, gender or class relations through its layout, where movement paths, sightlines and social interactions are pre-designed (such as office spaces emphasising a strict front–back segregation), is 2D. It focuses on the planar solidification of structure, representing a hierarchical mapping of human social power."},
  {aside:HUANG},
  {h3:"3D · The experience vessel"},
  {fig:"img/m-3d.jpg",small:true},
  {p:"3D architecture is meticulously designed: the ultimate expansion of the “2D plan” into the physical dimension. It not only reflects advancements in technology and materials but also explores how interior volume, light, shadow and texture directly shape individual psychology and emotion. The skyscraper represents the ultimate stacking of plans; parametric surfaces pursue the extremes of visual and structural efficiency; Kahn’s luminous spaces perfect sensory experience[[5]]. Yet no matter how tall, complex or awe-inspiring, its essence remains a closed system. Technology is used to perfect this vessel, not to break it. People are still defined within the container, consuming space, views, or light and shadow. When Louis Kahn’s Kimbell Art Museum quiets you to contemplate light, or when Peter Zumthor’s thermal baths (as described in Atmospheres[[6]]) focus you on water, stone and the body, they reach the peak of 3D. It may seem like the pinnacle of technology, yet it deploys the most advanced means to serve the most traditional “vessel” paradigm."}]},
 {part:"Space as a container",h:"Escape and falling",b:[
  {p:"The dilemma of 3D architecture lies in technological saturation. Parametric design, smart homes and the metaverse all attempt to integrate technological progress into spatial experience."},
  {p:"Patrik Schumacher defines parametricism as a style “rooted in digital and animation techniques,” emphasising the “avoidance of rigid geometric elements.” Yet, unintentionally, it forges new formal constraints, degenerating into a formalist “involution.” When Zaha Hadid Architects’ Morpheus Hotel showcases the power of parametric technology with its stunning exoskeleton, we must soberly recognise that if such technology remains limited to formal manipulation, it fails to touch the essence of architecture."},
  {p:"Recent Pritzker Prize trends have grown clearer: the award favours practices like Liu Jiakun’s, which break free from stylistic constraints and allow architecture to “summarise, refine, and reveal the intrinsic qualities of a place.” His “Recycled Bricks” are not just material but carriers of memory and emotion; the value of his West Village lies not in complex curves but in activating community life."},
  {p:"Parametric design, once a potentially revolutionary method, has turned into a specific “parametricist” style, exposing its inherent crisis. It alienates architects into “coding architects,” obsessed with weaving digital logic yet forgetting that architecture must ultimately return to the “human dimension”: the empathetic, memory-linking, everyday spatial experience."},
  {h3:"The failure of the metaverse"},
  {p:"The metaverse’s failure coincided with the COVID-19 era[[7]], a time craving real contact, but this is only superficial. The root cause is not technological failure but a complete neglect of architecture’s essential experience, composed of bodily scale, material texture, shifting light and shadow, and the serendipity of social interaction. Recalling our dimensional theory, Meta’s virtual rooms are crude 3D containers that utterly violate fundamental architectural principles. Christopher Alexander emphasised that “the person is the measure of all things.” In Meta’s world, there is no tactile sensation of a doorknob, no window sill adjusted for height variations, no echoes from different materials. It is an “architectural wasteland” devoid of scale and sensory richness."},
  {p:"It mistakenly attempts to replace experiential depth with information density, yet the true charm of space lies in those bodily perceptions that “cannot be symbolised as information”: the serene dome of the Pantheon, a bustling market, the warmth of sunlight on stone, mingled scents in the air, and the subtle sense of distance when passing others. Its failure confirms that the architectural principles we live by are the anchors of any “inhabitable space.” Without this wisdom, no “escape”, whether into physical or virtual realms, can succeed."},
  {fig:"img/m-meta.jpg",cap:"Sight, hearing, touch, smell, temperature, orientation, wind and sunlight: what a virtual room leaves out."},
  {h3:"Toward a higher-dimensional architecture"},
  {p:"The failure of the above technologies in spatial shaping and application stems from the lack of a unified, experience-centred spatial interaction framework. The predicament of smart homes offers a perfect case study: they should have been the first step toward high-dimensional space, but regrettably halted at the threshold. Smart bulbs, thermostats, voice assistants: each remains an optimised “object,” executing “if… then…” automation scripts."},
  {p:"A true “dimensional escape” requires shifting our perspective from “how to make individual appliances smarter” to “how to make the building itself a macro, unified intelligent entity”, as Mark Weiser foresaw, letting technology “disappear” into the environment. This means transforming walls, floors, ceilings and furniture into interfaces for perception and feedback, enabling spaces to interpret human emotions, intentions and behavioural traces (as explored by Philip Beesley), and evolving from cold containers into naturally “breathing” environments themselves."},
  {p:"These attempts outline a vague yet thrilling direction: high-dimensional architecture must deeply incorporate emotional elements, as Don Norman emphasises, fully engaging human senses and emotions. It must integrate real-time information, historical layers, virtual overlays and personalised narratives. Ultimately, architecture will no longer be a location but an interface accessing this high-dimensional space. Its core lies in breaking geographical constraints, bringing human perception into places or conveying the feeling of a place to someone far away."}]},
 {part:"Space as an interface",h:"4D · Space as an interface",b:[
  {fig:"img/m-4d.jpg",cap:"Unfold: the coordinating and interactive functions of the interface are implanted into space to form a spatial dimensionality. Use space as an interface and compress the process."},
  {p:"Dimensional escape is, at its core, a paradigm breakthrough from the static “container” to the dynamic “interface.” This breakthrough does not mean making a hole in the wall like a game portal, but using digital technology to break the limitations of time and geography. Mark Weiser[[8]], in his vision of Ubiquitous Computing, foresaw that the most profound technologies are those that “disappear,” weaving themselves seamlessly into the fabric of everyday life. As the ultimate “everyday” environment, architecture’s essence as an interface should not be a screen, but rather a medium integrated into the environment, facilitating a two-way dialogue."}]},
 {part:"Space as an interface",h:"New methodology",b:[
  {h3:"The sentient system"},
  {p:"First, architecture must become “The Sentient System.” This means endowing space with a nervous system capable of sensing both the environment and human activity. For instance, we can envision an intelligent wall inspired by Bernhard Leitner’s “Sound-Space.”[[9]] It would not only record sound but also track the movement trajectories of sound sources, the acoustic characteristics of the space, and even the specific light and air composition at a given moment. Upon playback, it would offer not a flat recording, but what Leitner defined as a “spatial sequence in time,” allowing people to sensorially re-inhabit the original spatio-temporal context through hearing and bodily perception. This grants architecture the capacity for memory and representation that transcends time."},
  {p:"The Interaction Geography technique is one visual method for exploring how people and things move and interact over space and time in settings like classrooms, museums and public spaces. The method is supported by two open-source tools: Mondrian Transcription for manually transcribing movement from video, and the Interaction Geography Slicer (IGS)[[10]] for dynamically visualising movement, conversation and video data over space and time."},
  {fig:"img/m-senses.jpg",cap:"How to record the senses? 12:34 people in action, gravity senses. 12:40 gravity sensing changes as a person walks to where smell is recorded and released. 12:51 the screen recording plays sunny weather on a rainy day."},
  {h3:"The spatial narrative"},
  {p:"Furthermore, interaction must evolve into “Spatial Narrative.” The ultimate goal of perception and narrative is to erode the boundary between physical and digital reality. Philip Beesley’s “Hylozoic Soil”[[11]] constructs an architectural ecosystem, using sensors and actuators, that enables it to breathe and react, demonstrating how physical space can possess a digitally empowered responsiveness. When a spatial construct becomes sentient, interaction should progress from simple commands to dynamic stories triggered by user behaviour."},
  {fig:"img/m-narr.jpg"},
  {h3:"Industry, infrastructure and urban structure"},
  {p:"UCL Bartlett’s “Fulfilment City”[[12]] project offers a grand preview, while Shenzhen’s April 2025 high-rise fire rescue test[[13]] using drones reveals how low-altitude drone logistics can serve as a new “urban grammar” that will fundamentally reshape urban form. This embodies Christopher Alexander’s concept of a “Pattern Language”: the idea that cities and buildings should be composed of patterns deeply connected to human activities. We will no longer design static plazas, but rather dynamic event scripts where pedestrian flows, data streams and drone currents interact."},
  {h3:"The phygital lens"},
  {p:"Ultimately, the interface becomes the “Phygital Lens.” At the urban scale, as seen in the preceding examples, this “interface” can permeate any infrastructure, thereby transforming application models. Infrastructure is not the city’s substructure; it is the urban structure itself (Extrastatecraft: The Power of Infrastructure Space, by Keller Easterling)[[14]]. These repeatable components (drones, food pickup stations, commercial streets, ATMs) are becoming carriers whose current development and widespread application are sufficient to enable a dimensional leap in global urban space. Here, the architect’s role transforms into that of a “curator of experience,” fully leveraging interactive interfaces to overlay space, city, history, data and virtual presence, ultimately achieving the teleportation of sensory experience."},
  {fig:"img/m-seoul.jpg",cap:"In the Seoul subway station: “Thank you for coming to Louvre Art Pavilion MOMA-2050.”"}]},
 {part:"Declaration",h:"Six rules",b:[{rules:[
  ["Interface as environment","Liberate the interface from the screen, seamlessly weaving it into walls, furniture and even the air. Make the whole building itself a diffuse and ubiquitous medium of perception and feedback."],
  ["Design time, not just space","Buildings should be able to record, reproduce and even rehearse spatio-temporal sequences. A “spatio-temporal data layer” gives space the ability to remember and even predict, so that users can perceive the superposition of time in the present."],
  ["From objects to ecosystems","Design thinking should shift from isolated “building monoliths” to interconnected “spatial ecosystems”. Each building is regarded as a node of the urban information network, connected and interacting rather than closed and independent."],
  ["Curatorial experience, not directive space","The core responsibility of architects shifts from designing static forms to curating dynamic “spatial narratives”: setting the initial flow lines and situations that guide the user’s interaction with space and keep it natural, reasonable and comfortable."],
  ["Automation as conversation","Go beyond “if–then” mechanical automation and pursue an organic dialogue of “perception–response.” The space should be able to recognise, record and convey human emotions, intentions and behavioural traces, forming a two-way interface with people, continuously learning and adapting."],
  ["Infrastructure kept free of control by power structures","Redefine the role of infrastructure. As an “active structure” of spatial form and social relations, infrastructure for logistics, energy and data flow should be designed to be open. As spatial politicians (in Keller Easterling’s sense), architects need to keep the “space protocol” service-oriented and secure, avoid controlled intrusion, and shape spatial justice."]]}]},
 {part:"Declaration",h:"Paradigms",b:[{table:{cols:["Theoretical paradigm","Elements","Focus"],rows:[
  ["Vitruvius","1. Solid  2. Practical  3. Beautiful","The physical stability of the building, the functional layout and the harmony of form."],
  ["Le Corbusier","1. Free plan  2. Free façade  3. Long horizontal windows  4. Raised ground floor  5. Roof garden","Liberate the material structure of the building; pursue light, air and flowing space."],
  ["Frampton","1. Pedestal  2. Structure  3. Enclosure  4. Heart","Materiality, authenticity, structure and the poetry of materials."],
  ["This declaration","1. Sensory field  2. Interactive narrative  3. Information stacking  4. Implanted infrastructure","A two-way dialogue between architecture and people; programmable and perceptible experience."]]}}]}
 ]},
zh:{kicker:"宣言 · 2025",title:"逃逸",sub:"二十一世纪建筑的高维空间",
 meta:[["时间","2025"],["类型","宣言"],["背景","墨尔本大学 建筑学硕士"],["完成方式","独立完成"]],
 bibH:"参考文献",notesPart:"注释",
 ch:[
 {part:"引言",h:"撕裂的时代",b:[
  {p:"我们生活在一个撕裂的时代。",lead:true},
  {p:"我们的思维以光速在云端社交、工作、娱乐，身体却被禁锢在由混凝土、玻璃与钢铁构成的静态容器之中。",drop:true},
  {p:"技术是建筑演进的核心驱动力，但建筑业也是采纳创新最慢的行业之一。别忘了，我们早已进入由人工智能引领的数字爆炸时代。在建造技术上，哈利法塔与快速城市化把人造结构推向前所未有的高度，参数化设计却逐渐沦为形式自省的循环。与此同时，元宇宙的愿景因其空洞与反人性而步履蹒跚。"},
  {p:"这一切都指向同一个核心矛盾：我们的灵魂与为身体设计的静态建成环境之间，鸿沟正在加深。建筑被困在一座自己建造的三维牢笼里。"},
  {p:"建筑必须顺应数字化转型，放弃静态物体的传统角色，拥抱一种交互的、自适应系统的新身份。它应被构想为一个高维界面，借助数字信息的潜力并与物理现实融合，加深我们对空间环境的掌控，最终彻底改变人的活动与感官体验。"},
  {p:"我们正站在关键的转折点上。是时候勇敢地发起一场彻底的范式转变了。"},
  {p:"我们宣告：建筑必须停止建造终点。我们迫切需要发起一场伟大的「维度逃逸」，超越被动「容器」的角色，主动演化为动态的「界面」。",strong:true}]},
 {part:"作为容器的空间",h:"困于三维",b:[
  {h3:"1D · 未经中介的身体"},
  {fig:"img/m-1d.jpg",small:true},
  {p:"一维建筑代表一种被动的极端。它不塑造内在生活，只以最本能、最一维的方式回应外部自然力量：雨、风、野兽。它唯一的向量是「生存」。正如维特鲁威原始棚屋的寓意版画[[1]]，它是一个没有功能的点：你知道可以在这里停下休息，在一个点上直面自然环境，那是一个悬停的瞬间。无论是直立人时代的原始庇护所，还是现代社会的防空洞，当核爆来临，它都会退化为纯粹的一维物体[[2]]。它只需要足够坚固。这无关「原始建筑」的风格[[3]]，而关乎一切建筑最根本、去社会化的本质。"},
  {h3:"2D · 秩序的平面"},
  {fig:"img/m-2d.jpg",small:true},
  {p:"当人类生产活动中出现多个基本单元并聚集在一起，便形成了最原始的建筑组合。我们可以把它们的投影图解定义为二维建筑。它通过平面写定规则（轴线、序列、尺度、朝向、等级），在一个又一个一维空间中规训人的移动、视线与交往。从一间简单的卧室、罗马万神庙，到如同一座住宅般组织起来的村落，都体现了这种构型的规训[[4]]。这并不限于哥特或古典风格；任何通过布局固化权力、性别或阶级关系的空间，只要其动线、视线与社交互动是被预先设计的（例如强调严格前后区隔的办公空间），都是二维的。它关注结构在平面上的固化，是人类社会权力的等级映射。"},
  {aside:HUANG},
  {h3:"3D · 体验的容器"},
  {fig:"img/m-3d.jpg",small:true},
  {p:"三维建筑经过精心设计，是「二维平面」向物理维度的终极扩展。它不仅反映技术与材料的进步，还探索室内体量、光、影与质感如何直接塑造个人的心理与情绪。摩天楼是平面的终极叠加；参数化曲面追求视觉与结构效率的极致；康的光之空间让感官体验臻于完美[[5]]。然而无论多高、多复杂、多震撼，它的本质仍是一个封闭系统。技术被用来完善这个容器，而不是打破它。人依然被定义在容器之内，消费着空间、景观或光影。当路易斯·康的金贝尔美术馆让你静下来凝视光，当彼得·卒姆托的温泉浴场（如《氛围》[[6]]中所写）让你专注于水、石头与身体，它们便抵达了三维的顶峰。这看似技术的巅峰，实则是用最先进的手段，服务于最传统的「容器」范式。"}]},
 {part:"作为容器的空间",h:"逃逸与坠落",b:[
  {p:"三维建筑的困境在于技术饱和。参数化设计、智能家居与元宇宙，都试图把技术进步融入空间体验。"},
  {p:"帕特里克·舒马赫将参数化主义定义为一种「植根于数字与动画技术」的风格，强调「避免僵硬的几何元素」。然而它无意中锻造了新的形式约束，退化为形式主义的「内卷」。当扎哈·哈迪德建筑事务所的澳门摩珀斯酒店以惊人的外骨骼展示参数化技术的力量时，我们必须清醒地认识到：如果这种技术只停留在形式操作上，它就触及不到建筑的本质。"},
  {p:"近年普利兹克奖的趋势愈发清晰：它青睐像刘家琨这样摆脱风格束缚、让建筑去「总结、提炼并揭示一个地方的内在品质」的实践。他的「再生砖」不只是材料，更是记忆与情感的载体；他的西村大院，价值不在复杂的曲线，而在于激活了社区生活。"},
  {p:"参数化设计曾是一种可能带来革命的方法，如今却变成了一种特定的「参数化主义」风格，暴露出其内在的危机。它把建筑师异化为「编码建筑师」，沉迷于编织数字逻辑，却忘了建筑最终必须回到「人的维度」：那种共情的、连接记忆的、日常的空间体验。"},
  {h3:"元宇宙的失败"},
  {p:"元宇宙的失败恰逢新冠时期[[7]]，一个渴望真实接触的时代，但这只是表象。根本原因不在技术失败，而在于它完全忽视了建筑的本质体验：身体的尺度、材料的质感、流转的光影，以及社交的偶然。回到我们的维度理论，Meta 的虚拟房间是粗糙的三维容器，彻底违背了基本的建筑原则。克里斯托弗·亚历山大强调「人是万物的尺度」。在 Meta 的世界里，没有门把手的触感，没有为不同身高调整的窗台，没有不同材料的回声。它是一片缺乏尺度与感官丰富性的「建筑荒原」。"},
  {p:"它错误地试图用信息密度取代体验深度，而空间真正的魅力，恰恰在于那些「无法被符号化为信息」的身体感知：万神庙宁静的穹顶、熙攘的市集、阳光照在石头上的温度、空气中交织的气味，以及与他人擦肩而过时微妙的距离感。它的失败证明，我们赖以生活的建筑原则，是任何「可栖居空间」的锚点。没有这份智慧，任何「逃逸」，无论通往物理还是虚拟世界，都不会成功。"},
  {fig:"img/m-meta.jpg",cap:"视觉、听觉、触觉、嗅觉、温度、方位、风与阳光：虚拟房间遗漏的一切。"},
  {h3:"迈向高维建筑"},
  {p:"上述技术在空间塑造与应用上的失败，源于缺少一个统一的、以体验为中心的空间交互框架。智能家居的困境是最好的例证：它本应是迈向高维空间的第一步，却遗憾地止步于门槛。智能灯泡、温控器、语音助手，每一个都只是被优化的「物体」，执行着「如果……就……」的自动化脚本。"},
  {p:"真正的「维度逃逸」，要求我们把视角从「如何让单个电器更聪明」转向「如何让建筑本身成为一个宏观、统一的智能体」，正如马克·维瑟所预见的，让技术「消失」在环境之中。这意味着把墙、地板、天花与家具变成感知与反馈的界面，让空间能够解读人的情绪、意图与行为痕迹（如菲利普·比斯利所探索的），从冰冷的容器演化为自然「呼吸」的环境本身。"},
  {p:"这些尝试勾勒出一个模糊却令人兴奋的方向：高维建筑必须深度融入情感要素，正如唐·诺曼所强调的，充分调动人的感官与情绪。它必须整合实时信息、历史层次、虚拟叠加与个性化叙事。最终，建筑将不再是一个地点，而是进入这一高维空间的界面。其核心在于打破地理限制，把人的感知带入某个地方，或把一个地方的感受传递给远方的人。"}]},
 {part:"作为界面的空间",h:"4D · 作为界面的空间",b:[
  {fig:"img/m-4d.jpg",cap:"展开：界面的协调与交互功能被植入空间，形成空间的维度。把空间当作界面，并压缩过程。"},
  {p:"维度逃逸的核心，是从静态「容器」到动态「界面」的范式突破。这种突破不是像游戏里的传送门那样在墙上开一个洞，而是用数字技术打破时间与地理的限制。马克·维瑟[[8]]在他的普适计算愿景中预言，最深刻的技术是那些「消失」的技术，它们无缝地织入日常生活的肌理。建筑作为终极的「日常」环境，其作为界面的本质不应是一块屏幕，而应是融入环境、促成双向对话的媒介。"}]},
 {part:"作为界面的空间",h:"新方法",b:[
  {h3:"感知系统"},
  {p:"首先，建筑必须成为「感知系统」。这意味着赋予空间一套能够同时感知环境与人类活动的神经系统。例如，我们可以设想一面受伯恩哈德·莱特纳「声音空间」[[9]]启发的智能墙。它不仅记录声音，还追踪声源的移动轨迹、空间的声学特性，甚至某一时刻具体的光线与空气成分。回放时，它呈现的不是平面的录音，而是莱特纳所定义的「时间中的空间序列」，让人通过听觉与身体感知，在感官上重新栖居于原初的时空情境。这赋予建筑超越时间的记忆与再现能力。"},
  {p:"「交互地理」是一种可视化方法，用来研究人与物如何在教室、博物馆、公共空间等场所中随时间与空间移动和互动。它由两个开源工具支持：用于从视频中手动转录移动的 Mondrian Transcription，以及用于在时空中动态可视化移动、对话与视频数据的 Interaction Geography Slicer（IGS）[[10]]。"},
  {fig:"img/m-senses.jpg",cap:"如何记录感官？12:34 人在活动，重力感知。12:40 人走到记录并释放气味的位置，重力感知随之变化。12:51 在雨天打开屏幕录像，播放晴天。"},
  {h3:"空间叙事"},
  {p:"进一步，交互必须演化为「空间叙事」。感知与叙事的终极目标，是消融物理现实与数字现实之间的边界。菲利普·比斯利的「物活论土壤」[[11]]借助传感器与执行器构建了一个会呼吸、会回应的建筑生态系统，展示了物理空间如何具备数字赋能的响应能力。当一个空间构造拥有了感知，交互就应从简单的指令，进化为由使用者行为触发的动态故事。"},
  {fig:"img/m-narr.jpg"},
  {h3:"产业、基础设施与城市结构"},
  {p:"伦敦大学学院巴特莱特学院的「履约城市」[[12]]项目提供了一个宏大的预演，而深圳 2025 年 4 月的超高层无人机消防救援实战测试[[13]]则表明，低空无人机物流可以成为一种新的「城市语法」，从根本上重塑城市形态。这体现了克里斯托弗·亚历山大的「模式语言」：城市与建筑应由与人类活动紧密相连的模式构成。我们将不再设计静态的广场，而是设计人流、数据流与无人机流相互作用的动态事件脚本。"},
  {h3:"虚实之镜"},
  {p:"最终，界面成为「虚实之镜」。在城市尺度上，正如前述案例所示，这一「界面」可以渗入任何基础设施，从而改变应用模式。基础设施不是城市的下层结构，它就是城市结构本身（凯勒·伊斯特林，《超国家治理：基础设施空间的力量》）[[14]]。无人机、取餐站、商业街、取款机这些可复制的组件，正在成为载体，它们当下的发展与广泛应用，已足以让全球城市空间实现维度的跃迁。在这里，建筑师的角色转变为「体验的策展人」，充分利用交互界面叠加空间、城市、历史、数据与虚拟在场，最终实现感官体验的远程传送。"},
  {fig:"img/m-seoul.jpg",cap:"在首尔地铁站：「感谢光临卢浮宫艺术展亭 MOMA-2050。」"}]},
 {part:"宣言",h:"六条原则",b:[{rules:[
  ["界面即环境","把界面从屏幕中解放出来，无缝织入墙体、家具乃至空气，让整栋建筑本身成为弥散而无处不在的感知与反馈媒介。"],

thorship": "作者", "Academic · individual": "课程作业 · 个人", "Kashgar’s ancient city, with its high terrace dwellings, holds a unique place among China’s high-density habitats. The spatial design, shaped by environment, customs and building techniques, reflects strong humanistic sentiment; the seemingly chaotic yet orderly streets and alleys weave a vibrant public life. Yet the new Kashgar is veering toward a “ghost city,” where high rises replace rich spiritual memories.": "喀什古城以高台民居著称，在中国高密度人居环境中独树一帜。由环境、习俗与建造技术塑造的空间，饱含浓厚的人文情感；看似杂乱实则有序的街巷，编织出充满活力的公共生活。然而新喀什正滑向一座“鬼城”，高楼取代了丰富的精神记忆。", "The project seeks to protect not only the buildings, but the carrier of culture and the way of life within it: to bridge the boundary of culture and the boundary of time in a new way, writing a fresh chapter for Kashgar.": "项目希望保护的不只是建筑，更是其中承载文化的容器与生活方式：以新的方式跨越文化的边界与时间的边界，为喀什写下新的篇章。", "Render view from the street": "街道人视效果图", "Entrance platform": "入口平台", "Aerial view over the old city": "老城鸟瞰", "Render view": "效果图", "Terrace front and corridor": "台地立面与连廊", "Project": "项目", "Field research": "实地调研", "The project involved on-site investigation of over 100 spatial nodes across the old city, revealing three distinct qualities: the hierarchy of roads, micro plaza spaces, and dwellings scattered by terrain elevation. Three road types, through roads, loop roads and dead ends, progressively intensify to define layers of private neighbourhood space; the site, the commercial street and the intervention of the modern city nest within one another in successive rings.": "项目在老城中调研了 100 多个空间节点，发现三种鲜明特质：道路的等级、微型广场空间，以及随地形高差散布的民居。穿行道、环路与尽端路三类道路逐级收紧，界定出层层私密的邻里空间；场地、商业街与现代城市的介入，一圈套一圈地嵌套在一起。", "Summary of venue research: arcades, entrances, steps, shops, internal circular roads, display street, public buildings and mosques.": "场地调研汇总：骑楼、入口、台阶、商铺、内部环路、展示街、公共建筑与清真寺。", "Analysis": "分析", "Why the old city grew this way": "老城为何这样生长", "This hierarchy is not accidental. As with other naturally grown villages in China, the basic form of Kashgar’s old city settlement is shaped by “spatial” relationships derived from clan bloodlines. As family populations grew, the old city expanded; streets were preserved, and became a second living room for people.": "这种等级并非偶然。与中国其他自然生长的村落一样，喀什老城聚落的基本形态，由宗族血缘衍生的“空间”关系塑造。家族人口增长，老城随之扩张；街道被保留下来，成为人们的第二客厅。", "Following the terrain, a single household, the child grows, street formation.": "顺应地形，一户人家，孩子长大，街道形成。", "Two cities, one boundary": "两座城，一条边界", "The boundary of Kashgar is sharply drawn: the old city on one side, the real estate city on the other, a collision of two civilisations and ideas.": "喀什的边界泾渭分明：一边是老城，一边是房地产新城，两种文明与观念在此碰撞。", "Origin of the form of the city of Kashgar.": "喀什城市形态的起源。", "Method": "方法", "Double diamond model": "双钻模型", "A diamond model was used to locate points of optimisation: strengthening functionality so that zones become nodes and comfortable spaces, with shops acting as a buffer between community and residence. The project ultimately aims at a community structure that draws neighbours closer.": "用双钻模型定位优化点：强化功能，让片区成为节点与舒适空间，以商铺作为社区与住宅之间的缓冲。项目最终指向一种让邻里更亲近的社区结构。", "Double diamond model pushed to logic.": "双钻模型推演出的逻辑。", "Logic": "逻辑", "Why walkability": "为什么是步行", "Comparing walkability across cities, Paris (intricate) and Barcelona (a regular grid) achieve comparable comfort despite their differing forms, both balancing practicality with a sense of interest, a quality shared by the old city’s streets.": "比较各城市的步行性，巴黎（错综）与巴塞罗那（规则网格）形态迥异，舒适度却相当，都在实用与趣味之间取得平衡；老城街道也具有同样的品质。", "This spatial logic, grown organically from bloodline relationships, aligns closely with contemporary walkable city theory. The streets themselves offer nearly a third of the time and space that can be lived outdoors, forming a lag space between the residential and the urban. The project draws on Jeff Speck’s": "这种由血缘关系有机生长的空间逻辑，与当代步行城市理论高度契合。街道本身提供了近三分之一可在户外度过的时间与空间，成为居住与城市之间的缓冲地带。项目借鉴杰夫·斯佩克的", "The Walkable City": "《适宜步行的城市》", ", accommodating car circulation, bike loops and the random walk of people to create walkable neighbourhoods.": "，兼顾车行、自行车环线与人的随意漫步，营造可步行的社区。", "Walkable city research: Anyang, Cairo-Giza, Urumqi, Erbil, Paris, Barcelona.": "步行城市研究：安阳、开罗-吉萨、乌鲁木齐、埃尔比勒、巴黎、巴塞罗那。", "Planning": "规划", "The logic of community formation": "社区形成的逻辑", "Transitional open environments with urban boundaries": "与城市边界相接的过渡性开放环境", "Highly private environment in the neighbourhood": "邻里中高度私密的环境", "The process of urban formation and common spatial places in Kashgar. Hover a dashed frame.": "喀什城市形成过程与常见的空间场所。鼠标移到虚线框上查看。", "Building": "建筑", "Plan and views": "平面与视点", "2nd floor plan. A entrance platform, B lobby lounge, C resting corner, D billiard area, E badminton area, F staircase and elevator, G lobby, H table tennis, I greenway, J fitness, K balcony, L connecting corridor.": "二层平面。A 入口平台，B 大堂休息区，C 休憩角，D 台球区，E 羽毛球区，F 楼梯与电梯，G 大堂，H 乒乓球，I 绿道，J 健身，K 阳台，L 连廊。", "1 · Entrance platform": "1 · 入口平台", "Entrance hall, with vertical circulation clearly visible.": "入口大厅，垂直交通一目了然。", "2 · Terrace front and corridor": "2 · 台地立面与连廊", "View along the building’s side corridor, where staggered floor slabs provide ample daylight and space for casual gathering while protecting residents’ privacy.": "沿建筑侧廊看去，错落的楼板带来充足的采光与随意聚集的空间，同时保护住户隐私。", "Select a point on the plan": "在平面上选择一个视点", "Section and spatial operations": "剖面与空间操作", "To preserve residents’ cultural inertia and create a variety of interior spaces, the project adopts an open structure. The main body uses a cantilevered system of thick beams and double wings; floor slabs are suspended in a bold departure from conventional storey logic, forming a suspension system at every 28m span. This strategy retains spatial freedom, giving public areas greater permeability while bringing neighbours closer together.": "为延续居民的文化惯性并营造多样的室内空间，项目采用开放结构。主体为厚梁双翼的悬挑体系；楼板被悬吊，大胆突破常规的楼层逻辑，每 28 米跨度形成一个悬吊系统。这一策略保留了空间的自由，使公共区域更具渗透性，也让邻里更加亲近。", "Section A-A.": "A-A 剖面。", "Modular frames": "模块化框架", "Multiple 5m by 5m unit frames incorporate terrain elevation as a variable, translated into a system of staggered floor slabs and split-level daylighting. Each frame in the top row can be paired with each frame in the left column. Choose one of each to assemble them.": "多个 5m×5m 的单元框架把地形高差作为变量，转化为错层楼板与分层采光的系统。上排每个框架都可以与左列每个框架组合，各选一个即可拼装。", "All 25 combinations": "全部 25 种组合", "Frames conforming to different height differences (5m × 5m).": "适应不同高差的框架（5m × 5m）。", "More projects": "更多作品", "All work →": "全部作品 →", "Legend": "图例", "Assembled frames": "拼装后的框架", "2026 · Feb–Jun": "2026 · 2月–6月", "Lakeside Terrace, Barbican Estate, London": "伦敦 巴比肯屋村 湖畔露台", "Second year, M.Arch, University of Melbourne": "墨尔本大学建筑学硕士二年级", "Three traders cut vertically through the Barbican as tunnel volumes, basement to workshop, each in their own material world: lime plaster, bent timber, cold steel. You are what you eat. Your knife is what you pick. This is a wonderland for discovering who you are.": "三位手艺人以隧道般的体量竖向穿过巴比肯，从地下室直到工坊，各自身处自己的材料世界：石灰抹灰、弯曲木材、冰冷钢铁。你吃什么，你就是什么；你挑哪把刀，刀就是你。这是一片发现自我的奇境。", "The project is sited within the Barbican Centre, inserting three independent shops, 89 Lime (perfumery), Curios (umbrellas) and 500 Knives (knife specialist), cutting vertically from the basement auction hall to the ground-level workshops. Though the three trade in different goods, they share the same relationship: made, sold, maintained, passed on.": "项目位于巴比肯中心，植入三家独立店铺：89 Lime（香水）、Curios（雨伞）与 500 Knives（刀具），从地下拍卖厅竖向贯穿到地面工坊。三家经营的商品不同，却共享同一种关系：制作、售卖、维护、传承。", "These three products are not chosen for utility. The scent you wear, the object you carry in the rain, the blade you keep for life: each carries a strong personal identity, and each begins with the hand. What can a shop space offer a person, beyond selling? Sensory Stock answers through sensory guidance and human behaviour. Made. Sold. Maintained. Passed on.": "选择这三种商品并非为了实用。你身上的气味、雨中随身的物件、一生珍藏的刀：每一样都带着强烈的个人身份，也都始于手工。除了售卖，店铺空间还能给人什么？Sensory Stock 用感官引导与人的行为来回答。制作。售卖。维护。传承。", "Model, top view": "模型，俯视", "Model, basement and ground floor": "模型，地下层与首层", "Stocking and display cabinet": "储存与展示柜", "The objects of the three trades.": "三种手艺的器物。", "Background": "背景", "The three shops are drawn from “Independent London,” each closely tied to daily life, spanning a spectrum from social settings to private, personal moments. More importantly, all three carry a distinctive, bespoke, heritage making process: this is why making and circulation become the most significant spaces for display and participation in the project. Above ground sits the workshop, where making happens; below ground sits the auction hall, where the maker’s finest pieces, residents’ inherited collections and customers’ own creations re-enter circulation. The building becomes a full life cycle of the object.": "三家店取自“独立伦敦”，都与日常生活紧密相关，从社交场合到私人时刻。更重要的是，三者都拥有独特、定制、传承的制作过程：这正是制作与流通成为项目中最重要的展示与参与空间的原因。地上是工坊，制作在这里发生；地下是拍卖厅，匠人的精品、居民传下的藏品与顾客自己的作品在这里重新进入流通。建筑成为器物完整的生命周期。", "Curios · sticks & umbrellas": "Curios · 手杖与雨伞", "Formerly James Smith & Sons, founded in 1830, a fifth-generation umbrella workshop, its bell ringing three times a day: the origin of the project’s “three bell ritual.”": "前身为 James Smith & Sons，创立于 1830 年，五代相传的雨伞工坊，每天敲钟三次：项目中“三钟仪式”的由来。", "Two Hundred Knives · knife specialist": "Two Hundred Knives · 刀具专门店", "Sourced directly from Japanese blade smiths, its 200-plus knives form a material archive, each one a tool to be touched and used, not a specimen behind glass.": "直接从日本刀匠处进货，200 多把刀构成一座材料档案馆，每一把都是可以触摸和使用的工具，而不是玻璃柜里的标本。", "89 Lime · family-run perfumers": "89 Lime · 家族香水店", "Formerly Floris, a nine-generation family-run perfumery still using its original 18th-century formula books; scent becomes a time machine, the fragrance you choose determining how the world remembers you.": "前身为 Floris，九代家族经营的香水店，至今沿用 18 世纪的原始配方簿；气味成为时光机，你选择的香气决定世界如何记住你。", "Strategy": "策略", "Display strategy": "展示策略", "The three products correspond to three degrees of human distance. 89 Lime at social distance, scent before sight. Curios at shoulder-to-shoulder distance, touching a handle as shared shelter. 500 Knives at intimate distance, close observation as trust. Purchasing becomes a sensory dialogue, not a simple transaction.": "三种商品对应三种人与人之间的距离。89 Lime 是社交距离，先闻其香再见其物；Curios 是并肩的距离，握住伞柄如同共享一片遮蔽；500 Knives 是亲密距离，近距离观察即是信任。购买成为一场感官对话，而不只是交易。", "Encounter, company, intimacy; memory, relationship, discipline.": "相遇、陪伴、亲密；记忆、关系、规训。", "Program composition": "功能构成", "The three shops sit along one axis, privacy increasing inward. Daylight shifts from exterior-reliant to volume-specific. Thick walls hold darkened chambers, doubling as display space. Each volume connects workshop above to auction hall below, a complete cycle of making, selling, circulation.": "三家店沿一条轴线排列，越往里越私密。采光从依赖外部转向各体量自有。厚墙中藏着暗室，同时作为展示空间。每个体量都把上方工坊与下方拍卖厅相连，形成制作、售卖、流通的完整循环。", "Hierarchy, stocking and display, geometry.": "层级、储存与展示、几何。", "Plans and sequence": "平面与序列", "A · Bridge and auction space": "A · 天桥与拍卖空间", "A long bridge offers first sight of the auction space below, the city fading as the journey turns inward.": "一条长桥让人第一次看到下方的拍卖空间，随着旅程向内，城市渐渐淡去。", "B · Beyond the light towers": "B · 穿过光塔", "Staggered light towers and hands-on workbenches turn the workshop into a montage of making.": "错落的光塔与可动手的工作台，把工坊变成一幅制作的蒙太奇。", "C · Immersive memory field": "C · 沉浸的记忆场", "Scent guides you through the Scent Well like a compass, the space glowing like a garden.": "气味像指南针一样引你穿过香之井，空间如花园般发光。", "D · Intimate ritual of choice": "D · 亲密的选择仪式", "A ten-metre light well anchors the umbrella warehouse, where you pull each one like a sword, testing weight and intimacy.": "一口十米高的光井锚定雨伞仓库，你像拔剑一样抽出每一把伞，感受重量与亲密。", "E · The sacred tension of craft": "E · 手艺的神圣张力", "Five hundred knives line a ten-metre wall, their cold precision drawing the eye up in quiet reverence.": "五百把刀排列在十米高的墙上，冷冽的精准把目光引向上方，静默而敬畏。", "Ground floor plan": "首层平面", "Basement plan": "地下层平面", "Materials, old and new structure": "材料，新旧结构", "Above ground, new construction: lightweight steel columns, polished concrete and timber. Each volume’s light responds to its privacy. The Scent Well, outermost, brightest, scent dispersing in full light. The Rain Cloister, centred, its glass deck drawing rain and daylight into the workshop below. The Slit of Light, innermost, most enclosed, light catching along the blade’s edge as its only source. Panels echo this: vertical rib, angled baffle, interlocking recess.": "地上为新建部分：轻钢柱、抛光混凝土与木材。每个体量的光都回应其私密程度。香之井在最外侧，最明亮，气味在充足的光线中弥散；雨廊居中，玻璃楼板把雨水与天光引入下方工坊；光之缝在最内侧，最封闭，唯一的光源沿刀刃闪烁。墙板与之呼应：竖向肋条、斜向挡板、咬合凹槽。", "Below ground, original brick and concrete are preserved, lit through curtain wall and west light well. Old and new layered together, making holds memory. Openings between volumes are framed views: commercial behaviour and craftsmanship, same frame.": "地下保留原有砖与混凝土，经由幕墙与西侧光井采光。新旧层叠，制作承载记忆。体量之间的开口是取景框：商业行为与手艺，同框呈现。", "Section.": "剖面。", "The slit of light": "光之缝", "A crack splits the ground, ten metres long and no wider than one metre. Light seeps up from the depths of the crack. The walls are uneven, a rough version of a town carved into the fissure of a whetstone. Customers retrieve knives from the basement, while employees work quietly above ground. Knives and the sound of sharpening shuttle up and down through this slit.": "一道裂缝劈开地面，长十米，宽不过一米。光从裂缝深处渗出。墙面凹凸不平，像是在磨刀石缝隙中凿出的一座粗粝小镇。顾客从地下取刀，员工在地上安静工作。刀与磨刀的声音沿这道缝上下穿梭。", "You place the knife on the lifting device. It slowly rises, passes through the cracks, passes through the light, and disappears into the ground. Light comes from a skylight above, reflects off metal, then scatters onto brick walls. The tone is cold, but not harsh.": "你把刀放在升降装置上。它缓缓上升，穿过裂缝，穿过光，消失在地面之中。光从上方天窗落下，在金属上反射，再散落到砖墙上。色调冷，却不刺眼。", "Open structure, sectional perspective: smell and sound, skylight, timber flooring.": "开放结构剖透视：气味与声音、天窗、木地板。", "Sectional perspective": "剖透视", "2021 · Sep–Oct": "2021 · 9月–10月", "Tieniu Village, Xilai Township, Pujiang County": "蒲江县西来镇铁牛村", "Fourth year, B.Arch, Tianjin University": "天津大学建筑学本科四年级", "Academic study · individual": "课程研究 · 个人", "The root of rural architecture lies in the most primitive needs of the human being, reflecting a human centredness and a home system that each person builds independently: the most fundamental point of difference between the city and the countryside. The project occupies a former elderly service centre for the village, long abandoned; combined with an early village walking route plan, the site has been reclaimed as an entry landmark for Tieniu Village, bringing together an iron smelting experience, an activity space and an important teahouse for rest.": "乡村建筑的根源在于人最原始的需求，体现以人为本，以及每个人独立建造的家园体系：这是城市与乡村最根本的不同。项目所在地原为村里的养老服务中心，已闲置多年；结合早期的村庄步行路线规划，场地被重新利用为铁牛村的入口地标，集冶铁体验、活动空间与重要的休憩茶馆于一体。", "John F. C. Turner’s theory suggests a mutual constraint between architecture, people and nature, forming a stable, comfortable environment. Turner believed a sketch is enough for architectural drawings, leaving room for improvisation. Drawings do not decide; only people standing on site can give architecture its most reasonable form.": "约翰·特纳的理论认为，建筑、人与自然相互制约，形成稳定、舒适的环境。特纳认为建筑图纸画个草图就够了，要为即兴留出余地。图纸不做决定；只有站在场地上的人，才能给建筑最合理的形式。", "Outdoor corridor": "室外廊道", "Under-eave deck": "檐下平台", "Model": "模型", "History of iron smelting culture": "冶铁文化历史", "Tieniu Village’s iron smelting history dates to the Warring States period. Archaeologists uncovered a piece of iron resembling a resting ox, the origin of the village’s name, “iron ox.” Several universities have since replicated the ancient smelting process here for teaching purposes.": "铁牛村的冶铁历史可追溯至战国时期。考古学家发现一块形似卧牛的铁块，这就是村名“铁牛”的由来。此后多所高校在此复原古代冶铁工艺用于教学。", "History of iron smelting culture.": "冶铁文化历史。", "Iron village general plan": "铁村总平面", "The site sits within a rural setting rich in history and landscape. Early plans set out a medium loop connecting key village sites for residents, fitness seekers and nature explorers, alongside a smaller accessible route. Both link existing landscape resources. The site itself acts as a staging post for village memory, the starting point of the tour.": "场地位于历史与景观资源丰富的乡村环境中。早期规划设置了一条中型环线，串联村中重要节点，服务居民、健身者与自然探索者，另有一条较小的无障碍路线。两者都连接现有景观资源。场地本身是村庄记忆的驿站，也是游览的起点。", "Original building": "原有建筑", "Community tourism route, village walking system, nodes for trail installations.": "社区旅游路线、村庄步行系统、步道装置节点。", "Process": "过程", "Villagers’ co-construction": "村民共建", "02 · Demolition parts": "02 · 拆除部分", "The original structure was a shear-wall structure with no weighing columns.": "原结构为剪力墙结构，没有承重柱。", "03 · Creating a new structure": "03 · 新建结构", "The load-bearing structure is made of timber from an orchard owned by the village of Iron Ox. The structure is separated from the walls and draws on Chinese column-and-tie-beam construction.": "承重结构采用铁牛村自有果园的木材。结构与墙体分离，借鉴中国传统穿斗式构造。", "04 · Addition": "04 · 加建", "New navigational routes and bathroom features create a better connection to the plaza and enhance the public nature of the fruit orchard.": "新的导览路线与卫生间设施加强了与广场的联系，提升了果园的公共性。", "05 · Iron smelting": "05 · 冶铁", "Placing iron smelting activities in the site’s Blast Furnace Plaza incorporates the historical memory of Iron Ox Village.": "把冶铁活动放在场地的高炉广场，融入铁牛村的历史记忆。", "06 · Casting tiles": "06 · 铸瓦", "Iron tiles can be used not only for roofing, but can also be arranged and combined at will to create walls and windows of different realities, filling the windows of the original building and transforming the connection between interior and exterior.": "铁瓦不仅可以做屋面，还可以随意排列组合，形成不同虚实的墙与窗，填补原建筑的窗洞，转变室内外的联系。", "Villagers’ co-construction, from original condition to building a house.": "村民共建：从原状到建房。", "Constraints and opportunities": "限制与机遇", "The local authority required rebuilding in situ, without extension. Yet the original structure was in fact quite new; the project sought a more economical way to open it toward the surrounding nature and village.": "当地要求原址重建，不得扩建。但原结构其实相当新；项目寻求一种更经济的方式，让它向周边的自然与村庄打开。", "General layout": "总平面布局", "· press and drag to zoom": "· 按住拖动放大", "Roof, eaves and low-energy design": "屋面、檐口与低能耗设计", "The eave regulates both daylight and thermal comfort, forming a double roof where openings between layers filter light without excess heat. As tiles accumulate over time, dappled light gradually fills the interior.": "檐口同时调节采光与热舒适，形成双层屋面，层间开口滤过光线而不带入过多热量。随着瓦片逐年累积，斑驳的光逐渐填满室内。", "In summer, doors open to the teahouse, cooling the eave space and circulating moisture. Rainwater collects in the smelting cooling pool for reuse, tying the project’s water back into the furnace it feeds.": "夏天门向茶馆敞开，为檐下空间降温并促进湿气流通。雨水收集到冶铁冷却池中再利用，让项目的水回到它所供给的熔炉。", "1 · Under the eaves": "1 · 檐下", "The under-eave deck by the teahouse.": "茶馆旁的檐下平台。", "2 · On the eave walkway": "2 · 檐上走道", "The small corridor above the eaves.": "檐口上方的小廊道。", "Section: roofs, eaves and low-energy design.": "剖面：屋面、檐口与低能耗设计。", "New structure": "新结构", "New structural details.": "新结构细部。", "Under the eaves": "檐下", "On the eave walkway": "檐上走道", "Section": "剖面", "2022 · May–Aug": "2022 · 5月–8月", "Virtual": "虚拟", "Group work · group leader. Research 60%, concept 60%, modelling 60%, rendering 70%, diagrams 50%": "小组作业 · 组长。研究 60%，概念 60%，建模 60%，渲染 70%，分析图 50%", "The project is not an actual architectural proposal, but rather an electronic spatial model with an ironic purpose, an exaggerated depiction of its space. It proposes that the history of spatial formation of coworking spaces is an aspect of observing the history of collaboration in human labour. Coworking can be described as a new form of collaboration, but also a new form of exploitation: a kind of “high-priced incubator.”": "这个项目不是真实的建筑提案，而是一个带有讽刺目的的电子空间模型，对其空间的夸张描绘。它提出：联合办公空间的形成史，是观察人类劳动协作史的一个切面。联合办公可以说是一种新的协作形式，也是一种新的剥削形式：一种“高价孵化器”。", "In this model, people in the system experience various cues that cause each person to compare the weight of his or her life with that of others. Almost all people end up in the same cycle of grief, just as the dragon-slayer boy eventually achieves a transformation of identity at some point and ends up as a dragon.": "在这个模型中，系统里的人经历种种暗示，使每个人都拿自己生命的分量与他人比较。几乎所有人都落入同一个悲伤的循环，就像屠龙少年终有一天完成身份的转变，最后变成了龙。", "Production scenario, Club quadrant": "生产场景，Club 象限", "Production scenario": "生产场景", "Production scenario, Den quadrant": "生产场景，Den 象限", "Revolution and labour": "革命与劳动", "Three roles share the park: the monitor, the product and the sufferer. Each answers to its own slogans: capacity, efficiency, profit; invention, sale, update; promotion, pay rise, grow.": "园区里有三种角色：监督者、产品与受难者。各自回应自己的口号：产能、效率、利润；发明、销售、更新；晋升、加薪、成长。", "Revolution and labour: the Boss, the Iteration, the Revenant.": "革命与劳动：老板、迭代、亡魂。", "Life cycles": "生命周期", "In this developing industrial park, different positions and people have different life cycles. Relatively speaking, sufferers and products will constantly change in the wave of development, while the cycle of the monitor is eternal. In the whole iteration process, the role of the monitor will continue to provide office space for workers, attract people to cooperate, control production, and obtain continuous benefits, and keep on.": "在这个不断发展的产业园中，不同岗位与人有不同的生命周期。相对而言，受难者与产品会在发展浪潮中不断更替，而监督者的循环是永恒的。在整个迭代过程中，监督者持续为工人提供办公空间，吸引人们合作，控制生产，获取持续收益，周而复始。", "Time progress and production methods; life cycle change diagram of different roles.": "时间进程与生产方式；不同角色的生命周期变化图。", "How a shared office works": "联合办公如何运作", "A Möbius band: the course of layoff, promotion and reward loops through Club, Den, Cell and Hive, from sharing to place to output. Level, reality and workflow sit underneath.": "一条莫比乌斯带：裁员、晋升与奖励的过程在 Club、Den、Cell 与 Hive 之间循环，从共享到场所再到产出。下方是层级、现实与工作流。", "Shared office system operating loop: Möbius band.": "联合办公系统运行循环：莫比乌斯带。", "Patterns of production and historical archetypes": "生产模式与历史原型", "Four quadrants, Cell, Den, Hive and Club, read the coworking space against its historical archetypes of production.": "Cell、Den、Hive、Club 四个象限，把联合办公空间与其历史上的生产原型对照阅读。", "The ring model: Cell, Den, Hive and Club.": "环形模型：Cell、Den、Hive 与 Club。", "People in the labour pool.": "劳动力池中的人。", "The labour force is converted from a labour slave to a secondary slave through disembarkation, with no change in nature.": "劳动力通过“下船”从劳动奴隶转变为次级奴隶，本质并无改变。", "Revenge and domestication: the “adjustment” of values through mechanical repetition of work. In the early 20th century, offices took the form of small openings and silos with relatively separate spaces and good privacy, but with an overemphasis on hierarchy and the concept of office privacy.": "报复与驯化：通过机械重复的劳动“调整”价值观。20 世纪初，办公室是小开口、筒仓式的形态，空间相对分隔、私密性好，却过分强调等级与办公隐私的观念。", "The benefits of whitewashing have invaded people’s minds. People want to realise the sky garden in their lives efficiently and simply.": "洗白的好处已侵入人心。人们希望高效而简单地在生活中实现空中花园。", "Morality and ethics are the final screening tools, and those who do not pass go into self-sufficiency mode, or else stay in the system as overseers.": "道德与伦理是最后的筛选工具，未通过者进入自给自足模式，或者留在系统中成为监工。", "A complex cooperative office model, the Phalanstère: liberation from centralisation and the reconfiguration of space according to federal principles.": "一种复杂的合作办公模式，法伦斯泰尔：从集权中解放，按联邦原则重构空间。", "Agriculture – industry; food – output; energy – conversion rate; primitive agro-industrial society – modern telecommunication society.": "农业–工业；食物–产出；能源–转化率；原始农工社会–现代电讯社会。", "The invisible ceiling of the supervisor cuts off the connection between the top of the company and the executive.": "主管看不见的天花板，切断了公司高层与执行层之间的联系。", "The expo represents communication power and influence; it is also a window for workers to collect spiritual sustenance, and an entertainment club for business leaders to exchange resources.": "博览会代表传播力与影响力；它也是工人收集精神寄托的窗口，是商业领袖交换资源的娱乐俱乐部。", "The skyscraper of entrepreneurs draws a distinction between old and new forces, and the eliminated enter a new cycle.": "企业家的摩天楼划分了新旧势力，被淘汰者进入新的循环。", "New products are released.": "新产品发布了。", "I have an endless life cycle.": "我拥有无尽的生命周期。", "Narrative": "叙事", "Architectural prototype translation": "建筑原型转译", "Architectural prototype translation.": "建筑原型转译。", "Coda": "结语", "Could the AI revolution end our age of cloud serfdom, the age of": "AI 的技术革命，能否终结我们的云农奴时代，也就是", "technofeudalism": "技术封建主义", "? Living inside this moment, we fail to recognise the opportunity. Instead, we are seized by panic at the abolition of our own servitude.": "？而身处其中的我们，非但未能认清这一契机，反而因奴役制度的废除而感到恐慌。", "Ring model": "环形模型", "2025 · Studio E": "2025 · Studio E", "Edinburgh Gardens, Fitzroy, Melbourne": "墨尔本 菲茨罗伊 爱丁堡花园", "M.Arch, University of Melbourne": "墨尔本大学建筑学硕士", "Stand + Stage sits at the edge of Edinburgh Gardens in Fitzroy, where city meets park and history meets renewal. The site once held the Grandstand, a structure that burned down after decades of decline, shaped by the departure of the Fitzroy Football Club and shifting demographics. Yet the community never let go. Today the club thrives with a waiting list.": "Stand + Stage 位于菲茨罗伊爱丁堡花园的边缘，城市与公园、历史与更新在此交汇。场地上曾有一座看台，在多年衰落后被大火烧毁；衰落源于菲茨罗伊足球俱乐部的离开与人口结构的变化。但社区从未放手。如今俱乐部兴旺，入会还要排队。", "The design asks: can a building be both the athlete’s stage and the family’s stand? Sport, for young athletes, is performance; it needs to be seen and recognised. But existing clubs forget the people on the sidelines. This building remembers them. Through three thresholds, geographic (city to park), atmospheric (quiet to active) and state (daily to focused), Stand + Stage becomes a social catalyst. It is a place that stores carbon, grows from rain, makes its own energy, and holds people so they can be seen.": "设计提出一个问题：一座建筑能否既是运动员的舞台，又是家人的看台？对年轻运动员来说，运动是表演，需要被看见、被认可。可现有的俱乐部忘记了场边的人。这座建筑记得他们。通过三重阈限：地理的（从城市到公园）、氛围的（从安静到活跃）、状态的（从日常到专注），Stand + Stage 成为社会的催化剂。它储存碳，从雨中生长，自己产生能源，并容纳人们，让他们被看见。", "Recycled glass bricks in the changing rooms": "更衣室中的再生玻璃砖", "Timber walkway": "木构步道", "Timber frame looking onto the garden": "望向花园的木框架", "Upper terrace among the trees": "树间的上层露台", "Courtyard and retained trees": "庭院与保留的树", "Research": "研究", "Site and history": "场地与历史", "The site’s history runs from the sportsman’s war memorial of 1914–1919 to the fire that destroyed the grandstand. The Fitzroy Football Club left, demographics shifted, and the structure declined, yet the community kept the club alive.": "场地的历史从 1914–1919 年的运动员战争纪念碑，一直延续到烧毁看台的那场大火。菲茨罗伊足球俱乐部离开，人口结构变化，建筑日渐衰败，但社区让俱乐部延续了下来。", "The sportsman’s war memorial; the grandstand before the fire.": "运动员战争纪念碑；火灾前的看台。", "A path worn across the lawn": "草坪上被踩出的小路", "Incongruous dilapidation": "不协调的破败", "Picturesque trees and a neglected back garden": "如画的树木与被忽视的后花园", "The tennis club keeps to itself": "网球俱乐部自成一体", "Standing at the crossroads, yet the grandstand remains hidden": "位于十字路口，看台却始终被遮挡", "Behind the slope bench, nothing but a decaying fence": "坡地长椅后面，只有一道腐朽的围栏", "Site scale: problems 1–6 marked on the plan.": "场地尺度：平面上标出的问题 1–6。", "Path worn across the lawn": "草坪上被踩出的小路", "Grandstand hidden at the crossroads": "十字路口被遮挡的看台", "Grandstand from the oval": "从椭圆场看看台", "Back garden": "后花园", "Tennis club fence": "网球俱乐部围栏", "Tennis courts": "网球场", "Decaying fence": "腐朽的围栏", "Picturesque trees": "如画的树木", "Behind the slope bench": "坡地长椅后面", "Who the club is for": "俱乐部为谁而建", "Keith Tsang": "Keith Tsang", "Lacrosse player · PhD in Physiotherapy, The University of Melbourne · Member of the Camberwell Lacrosse Club": "长曲棍球运动员 · 墨尔本大学物理治疗博士 · Camberwell 长曲棍球俱乐部成员", "“The dressing room needs to be divided into home and away…": "“更衣室需要分为主队和客队……", "This has positive psychological implications for playing.": "这对比赛有积极的心理作用。", "At the same time, it is important to separate the flow of the dressing room and the club’s opening to the public…": "同时，更衣室的流线要与俱乐部的公共开放部分分开……", "It is also important that the locker room flow and bathroom of the two teams are separated, and friction on the pitch can easily lead to physical altercations.": "两队的更衣室流线与卫生间也要分开，场上的摩擦很容易引发肢体冲突。", "The club’s new and old players may be family or friends…": "俱乐部的新老队员可能是家人或朋友……", "Usually, during the celebration, you can see a lot of children and puppies playing in the club with bats…”": "庆祝的时候，常常能看到很多孩子和小狗拿着球棍在俱乐部里玩……”", "“In fact, what every": "“其实每个", "athlete hopes for most is that relatives and friends will come to watch the game and watch us play these days…": "运动员最希望的，就是亲友能来看比赛，看我们这些日子的拼搏……", "It’s a very important part of an athlete’s life, but usually no one knows how much we’re going to pay for it…”": "这是运动员生活中非常重要的一部分，但通常没人知道我们为此付出了多少……”", "The performer": "表演者", "Professional, private, focusable: a “backstage” for appearance and exit.": "专业、私密、可专注：一个登场与退场的“后台”。", "Changing room · showering · coaching": "更衣室 · 淋浴 · 训练指导", "Family and friends": "家人与朋友", "Comfortable and participatory; can clearly see the efforts of athletes and give timely recognition.": "舒适且可参与；能清楚看到运动员的努力并及时给予认可。", "Corridor · coffee · children’s play corner · participate play ground": "走廊 · 咖啡 · 儿童游戏角 · 参与式游乐场", "Park visitors": "公园游客", "A landmark that sparks curiosity; basic commercial and resting space.": "激发好奇的地标；基本的商业与休憩空间。", "A short-stop coffee · attractive facade · public stage": "短暂停留的咖啡 · 有吸引力的立面 · 公共舞台", "Residents around the site": "周边居民", "Exercise and public amenities.": "运动与公共设施。", "Public toilet · public storage · public gym": "公共厕所 · 公共储物 · 公共健身房", "Moment study.": "瞬间研究。", "Concept": "概念", "Bubble diagram": "泡泡图", "The brief moves from an inner focus, bathroom and changing room, outward to the community building, the club, the garden and Fitzroy.": "任务书从内部的焦点，卫生间与更衣室，向外延伸到社区建筑、俱乐部、花园与菲茨罗伊。", "Bubble diagram, redrawn. Circle size follows room area.": "重绘的泡泡图。圆的大小对应房间面积。", "Functional requirements": "功能需求", "Each space is rated for natural ventilation, air control, natural views and daylight.": "对每个空间的自然通风、空气控制、自然景观与采光需求进行评级。", "Space": "空间", "Qty": "数量", "Area m²": "面积 m²", "Natural vent": "自然通风", "Air control": "空气控制", "Natural views": "自然景观", "Daylight": "采光", "Reception": "接待处", "Public Toilet (Total)": "公共厕所（合计）", "Firs
