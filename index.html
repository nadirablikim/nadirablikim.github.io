y, and a roof garden.": "首层：社区与多功能厅、餐厅与咖啡馆、室外露台、俱乐部休息室与酒吧、厨房、裁判设施、更衣室、接待处、急救、游乐场与儿童角。二层：看台走廊舞台、俱乐部健身房、运动员健身房、物理治疗与屋顶花园。", "First floor plan": "二层平面", "Materials as carbon sinks": "材料即碳汇", "Timber is the Stand: strong, warm, rooted. It holds the building up, stores carbon from the air, and gives the space its character. The facades are the Stage: they change with people’s needs.": "木材是看台（Stand）：坚固、温暖、扎根。它支撑建筑，储存空气中的碳，赋予空间性格。立面是舞台（Stage）：随人们的需要而变化。", "Titanium zinc roof": "钛锌屋面", "100% recyclable · 80–100 yr": "100% 可回收 · 80–100 年", "FSC timber, glulam beam": "FSC 木材，胶合木梁", "Carbon sink": "碳汇", "Timber window frames": "木窗框", "Triple glazing, U ≤ 0.8": "三层玻璃，U ≤ 0.8", "Reused grandstand brick": "回收的看台砖", "Zero transport carbon": "零运输碳", "Recycled glass bricks": "再生玻璃砖", "Privacy + daylight": "隐私 + 采光", "Recycled glass": "再生玻璃", "30–50% recycled content": "30–50% 再生含量", "Curtain wall, timber keel": "幕墙，木龙骨", "Prefabricated module": "预制模块", "Cellulose insulation": "纤维素保温", "85% recycled newspaper": "85% 回收报纸", "Rainwater tank": "雨水箱", "Timber walkway: reused brick base, FSC timber cladding, titanium zinc roof.": "木构步道：回收砖基座、FSC 木材外挂、钛锌屋面。", "Integrated environmental strategy": "综合环境策略", "Stand + Stage is not just a building; it holds people and performs with them. Five strategies work together: carbon, construction, environment, energy and experience. Each numbered dot on the sections belongs to one of them.": "Stand + Stage 不只是一座建筑；它容纳人，并与人一起表演。五种策略协同作用：碳、建造、环境、能源与体验。剖面上每个编号圆点都属于其中一类。", "Carbon": "碳", "Material selection": "材料选择", "Structure": "结构", "CLT and glulam frame. Timber replaces concrete and steel and stores biogenic carbon.": "CLT 与胶合木框架。木材取代混凝土与钢材，储存生物碳。", "Base cladding": "基座外墙", "Brick reclaimed from the old grandstand on site: no transport carbon, longer material life, no demolition emissions.": "回收自场地上旧看台的砖：零运输碳，延长材料寿命，避免拆除排放。", "Upper cladding": "上部外墙", "FSC-certified timber. Stores carbon, no high-carbon coatings.": "FSC 认证木材。储存碳，无高碳涂层。", "Insulation": "保温", "Cellulose, 85% recycled newspaper. Carbon-negative, dense-packed for airtightness, fire and pest resistant.": "纤维素，85% 回收报纸。负碳，密实填充保证气密，防火防虫。", "Window frames": "窗框", "FSC timber instead of aluminium. Lower embodied carbon, and it stores carbon.": "以 FSC 木材取代铝材。隐含碳更低，并且储存碳。", "Roofing": "屋面", "Titanium zinc standing seam. Fully recyclable, 80 to 100 year life, lighter than clay tile and lower carbon than aluminium; takes the curved profile without a heavier structure.": "钛锌直立锁边。完全可回收，寿命 80 到 100 年，比黏土瓦轻，比铝材碳排放低；可做曲面而无需加强结构。", "Glazing": "玻璃", "Triple glazing, U ≤ 0.8, with 30 to 50% recycled glass.": "三层玻璃，U ≤ 0.8，含 30 到 50% 再生玻璃。", "Low-light areas": "低光区域", "Recycled glass in the changing rooms: privacy and daylight without extra cladding.": "更衣室使用再生玻璃：兼顾隐私与采光，无需额外外墙材料。", "Construction": "建造", "Disassembly and adaptability": "可拆卸与适应性", "Separate layers": "分层构造", "Structure carries the loads, cladding wraps outside. Insulation runs unbroken with no thermal bridges, and the layers can be taken apart.": "结构承担荷载，外墙包裹在外。保温连续无热桥，各层可以拆开。", "Dry joints": "干式连接", "Bolted and dowelled connections, no wet trades. Reversible, so components can be reused.": "螺栓与销钉连接，无湿作业。可逆，构件可再利用。", "Modular panels": "模块化墙板", "Four prefabricated wall modules on one grid: full-glazed, half-glazed, solid and door. Easy to swap, less waste at end of life.": "同一网格上的四种预制墙体模块：全玻璃、半玻璃、实墙与门。易于更换，寿命结束时废料更少。", "Insulation continuity": "保温连续", "No penetrations, so thermal performance holds through use and retrofit.": "无穿透，热工性能在使用与改造中保持稳定。", "Environment": "环境", "Passive design": "被动式设计", "Facade": "立面", "Vertical louvres east and west block low sun, keep privacy and let air through.": "东西向竖向百叶遮挡低角度阳光，保护隐私并通风。", "Gym shading": "健身房遮阳", "Angled horizontal louvres on the north stop summer overheating and let winter sun in.": "北侧倾斜水平百叶防止夏季过热，冬季让阳光进入。", "Restaurant roof garden": "餐厅屋顶花园", "Green roof and high-level windows cut heat gain and drive cross-ventilation, lowering cooling demand.": "绿色屋顶与高侧窗减少得热、促进穿堂风，降低制冷需求。", "Controlled south glazing and the roof pitch bring in diffuse light with little glare.": "受控的南向玻璃与屋面坡度引入漫射光，眩光很少。", "Energy": "能源", "Active systems": "主动系统", "Rainwater harvesting": "雨水收集", "The pitched roof fills two 4,510 L tanks that water the central garden and rain garden.": "坡屋顶为两个 4,510 升水箱集水，用于浇灌中央花园与雨水花园。", "PV array": "光伏阵列", "Roof-integrated panels, 18 facing north and 8 facing north-west, power ventilation, lighting and the pump.": "屋面一体化光伏板，18 块朝北、8 块朝西北，为通风、照明与水泵供电。", "Experience": "体验", "Thresholds and adaptability": "阈限与适应性", "Public to private": "从公共到私密", "Garden, then gym and multi-function hall, then changing rooms: a gradual, user-controlled sequence.": "花园，然后是健身房与多功能厅，再到更衣室：渐进的、由使用者掌控的序列。", "Flexible hall": "灵活大厅", "Large-span timber structure for the gym, markets and community events.": "大跨度木结构，可用作健身房、市集与社区活动。", "Visual connection": "视线联系", "Glazed and louvred facades balance openness and privacy: an active street front, a calm interior.": "玻璃与百叶立面平衡开放与私密：活跃的街道界面，安静的室内。", "Health and green showcase": "健康与绿色示范", "Exposed timber and visible systems show low-carbon living at work.": "外露的木材与可见的系统，展示低碳生活如何运作。", "Section through the changing rooms and gym.": "穿过更衣室与健身房的剖面。", "Long section through the grandstand stage.": "穿过看台舞台的长剖面。", "Rain falls on the roof, is collected, and waters the garden below. The sun powers the lights and fans. After many years the timber will stand again somewhere else, the brick will be relaid, the metal remade.": "雨落在屋顶，被收集，浇灌下方的花园。阳光为灯与风扇供电。多年以后，木材将在别处再次站立，砖会被重新砌筑，金属会被重新铸造。", "The courtyard under the retained tree.": "保留大树下的庭院。", "Wall and roof build-up": "墙体与屋面构造", "The external wall grew from 240 mm to 350 mm to hold 240 mm of cellulose insulation and meet low-energy performance. Structure and cladding are separate layers with dry, bolted joints, so the building can be taken apart and reused.": "外墙从 240 mm 增加到 350 mm，以容纳 240 mm 的纤维素保温，达到低能耗性能。结构与外墙分层，干式螺栓连接，建筑可以拆解再利用。", "Roof and wall details.": "屋面与墙体细部。", "Reflection": "反思", "Whole life carbon": "全生命周期碳", "Operational and end-of-life carbon fell to very low levels, but early form-finding decisions kept embodied carbon high: a lesson for the next project. While whole life carbon considerations impose constraints, an exam without limits often yields no answers.": "运行碳与寿命终结阶段的碳降到了很低的水平，但早期找形的决定让隐含碳居高不下：这是留给下一个项目的教训。全生命周期碳的考量会带来限制，但没有限制的考试往往也没有答案。", "tonnes CO₂-e over a 50-year lifespan": "吨 CO₂-e，50 年寿命期", "kg CO₂-e per m²": "kg CO₂-e 每平方米", "Australians’ average annual emissions": "澳大利亚人的年均排放", "tonnes sequestered in biogenic materials": "吨，储存在生物基材料中", "Stage": "阶段", "Total t CO₂-e": "总计 t CO₂-e", "kg CO₂-e / m²": "kg CO₂-e / m²", "Upfront": "前期", "Recurrent": "周期性", "Operational": "运行", "Sequestered": "固碳", "Concept design": "概念设计", "Interim": "中期", "Resolved design": "深化设计", "Building and energy (interim sheets)": "建筑与能耗（中期表格）", "Total floor area": "总建筑面积", "Total envelope area": "外围护总面积", "Form factor": "体形系数", "Annual heating energy": "年采暖能耗", "Annual cooling energy": "年制冷能耗", "Total annual energy demand": "年总能耗需求", "Energy produced on site": "场地产能", "Rainwater harvested": "雨水收集量", "≈104,000 L/yr": "≈104,000 升/年", "Whole life strategy, A1 to D": "全生命周期策略，A1 到 D", "Product": "产品", "CLT / glulam stores ~1.2 t CO₂e/m³": "CLT / 胶合木储碳约 1.2 t CO₂e/m³", "Cellulose insulation, 85% recycled newspaper, ~−50 kg CO₂e/m³": "纤维素保温，85% 回收报纸，约 −50 kg CO₂e/m³", "Reused brick + FSC timber cladding": "回收砖 + FSC 木材外墙", "FSC timber window frames replace aluminium (~200 kg CO₂e/m²)": "FSC 木窗框取代铝窗框（约 200 kg CO₂e/m²）", "Recycled glass, 30–50% recycled content": "再生玻璃，30–50% 再生含量", "Titanium zinc roof, ~6 kg CO₂e/m²": "钛锌屋面，约 6 kg CO₂e/m²", "Lightweight + local + modular": "轻量 + 本地 + 模块化", "Reused brick reclaimed on site: zero transport carbon": "场地回收砖：零运输碳", "Local FSC-certified timber": "本地 FSC 认证木材", "Prefabricated, standard-size wall modules": "标准尺寸预制墙体模块", "Dry bolted / dowelled joints: no wet trades": "干式螺栓 / 销钉连接：无湿作业", "Use and maintenance": "使用与维护", "Durable + replaceable": "耐久 + 可更换", "Titanium zinc + cellulose: lifespan > 50 years, fewer B4 replacements": "钛锌 + 纤维素：寿命 > 50 年，减少 B4 更换", "Modular panels and demountable joints: local replacement": "模块墙板与可拆卸节点：局部更换", "Exposed CLT thermal mass reduces equipment reliance": "外露 CLT 热质量减少对设备的依赖", "Operational energy and water": "运行能源与用水", "Passive first, active second": "被动优先，主动其次", "North shading, east/west vertical louvres": "北侧遮阳，东西向竖向百叶", "Summer SE intake, NW exhaust; winter NW facade sealed": "夏季东南进风、西北排风；冬季西北立面封闭", "Airtight layer, thermal-bridge-free detailing": "气密层，无热桥构造", "PV 2.7 m², ~550 kWh/yr": "光伏 2.7 m²，约 550 kWh/年", "Rainwater 2 × 4,510 L, ~104,000 L/yr": "雨水 2 × 4,510 升，约 104,000 升/年", "End of life and beyond": "寿命终结及之后", "The building as a material bank": "建筑作为材料银行", "CLT / glulam reused or downcycled as timber": "CLT / 胶合木再利用或降级为木材", "Cellulose compostable or recyclable": "纤维素可堆肥或回收", "Brick reclaimed again": "砖再次回收", "Titanium zinc 100% recyclable": "钛锌 100% 可回收", "Glass recyclable": "玻璃可回收", "Site problems": "场地问题", "Moment study": "瞬间研究", "2025 · Studio C06, The 5th Gate": "2025 · Studio C06，第五道门", "Shrine of Remembrance, Kings Domain, Melbourne": "墨尔本 国王领地 战争纪念馆", "The site lies in the domain of the Shrine of Remembrance, a sacred ground dedicated to those who died for the nation. Yet this land holds older, quieter memories. It is part of the traditional gathering grounds of the Boonwurrung people along the Yarra River, and it carries forgotten scars of the colonial Frontier Wars. The paradox is profound: the stone of a shrine that commemorates some wars was quarried from dispossessed Country, and for a long time the monument stayed silent about the trauma on this very land.": "场地位于战争纪念馆的领域内，这是一片献给为国捐躯者的圣地。然而这片土地承载着更古老、更安静的记忆。它是 Boonwurrung 人沿亚拉河的传统聚集地之一，也带着殖民时期边疆战争被遗忘的伤痕。悖论深刻：纪念某些战争的神殿，其石材开采自被剥夺的土地，而这座纪念碑长久以来对发生在这片土地上的创伤保持沉默。", "The design confronts this paradox directly. It does not overwrite or replace the Shrine; it acts as its critical counterpart, a negative space that must be closely read to be understood, dedicated to the casualties left out of the official narrative.": "设计直面这一悖论。它不覆盖也不取代纪念馆，而是作为其批判性的对应物，一个必须细读才能理解的负空间，献给被官方叙事遗漏的逝者。", "I respectfully acknowledge the Boonwurrung people of the Kulin Nation, Traditional Custodians of the land on which this project was made, and pay my respects to their Elders past, present and emerging.": "我谨向库林族群的 Boonwurrung 人致敬，他们是本项目所在土地的传统守护者；向他们过去、现在与未来的长者致以敬意。", "The pool beneath the arch": "拱下的水池", "The courtyard from the Shrine steps": "从纪念馆台阶望向庭院", "The curved wall and the water mirror": "弧墙与水镜", "The Shrine seen from below": "从下方看纪念馆", "Across the shallow water": "越过浅水", "Site": "场地", "The other side of a single view": "同一视线的另一面", "From the Shrine’s balcony the view runs straight down St Kilda Road to the city. The design sits in that view without interrupting it: a void cut into the forecourt, visible only as you approach.": "从纪念馆的阳台望去，视线沿圣基尔达路直通城市。设计置身于这条视线中却不打断它：一个切入前庭的虚空，只有走近才能看见。", "Aerial view of the forecourt.": "前庭鸟瞰。", "Time flowing, quarry excavating": "时间流动，采石掘地", "The Shrine is built from Victorian stone: Tynong granodiorite for the sanctuary and ambulatory, Buchan black marble for the sixteen Ionic columns and the Stone of Remembrance, Harcourt granite for the World War II Cenotaph, Footscray basalt for its sculpture and the upper balcony paving. Sixty-four kilometres from Tynong, at Mount Cottrell near Werribee, ten Aboriginal people were killed on 16 July 1836. The Shrine’s timeline begins in 1914; the Frontier Wars, from 1788 and lasting more than a century, were long left out of the nation’s military commemoration.": "纪念馆由维多利亚州的石材建成：圣殿与回廊用 Tynong 花岗闪长岩，十六根爱奥尼柱与纪念石用 Buchan 黑色大理石，二战纪念碑用 Harcourt 花岗岩，其雕塑与上层阳台铺地用 Footscray 玄武岩。距 Tynong 六十四公里外的维里比附近 Mount Cottrell，1836 年 7 月 16 日有十名原住民遇害。纪念馆的时间线从 1914 年开始；而始于 1788 年、持续一个多世纪的边疆战争，长期被排除在国家的军事纪念之外。", "Time flowing (left), the quarries and Mount Cottrell (centre), quarry excavating (right).": "时间流动（左），采石场与 Mount Cottrell（中），采石掘地（右）。", "A continent of points": "一片由点组成的大陆", "Mount Cottrell was not an isolated tragedy, only one of the earliest points on the map of this region. As the timeline moves forward, massacre sites spread from the first settlements across the continent at a shocking speed and density.": "Mount Cottrell 并非孤立的悲剧，只是这一地区地图上最早出现的点之一。随着时间线推进，屠杀地点从最早的定居点向整片大陆扩散，速度与密度令人震惊。", "Footprints as evidence: the platforms around the pool are sized by the deaths in each period, largest where the toll surged. The wet footprints visitors leave on them are fleeting testimonies.": "足迹即证据：水池周围平台的大小按各时期的死亡人数确定，伤亡激增的时期平台最大。访客留下的湿脚印，是转瞬即逝的证词。", "Massacre sites appear as the timeline moves forward. Data: Ryan et al.,": "随时间线推进出现的屠杀地点。数据来源：Ryan 等，", "Colonial Frontier Massacres in Australia, 1788–1930": "《澳大利亚殖民边疆屠杀，1788–1930》", ", University of Newcastle.": "，纽卡斯尔大学。", "Massacres per decade, 1780s–1900s, grouped into the five platforms.": "每十年的屠杀次数，1780 年代–1900 年代，归为五个平台。", "Scholarly development": "学术发展", "The two sides of a single view": "同一视线的两面", "Henry James Johnstone, Evening Shadows, Backwater of the Murray, South Australia, 1880.": "Henry James Johnstone，《暮影，墨累河回水，南澳大利亚》，1880。", "“Most of the massacres [of Indigenous people] that took place around Australia were at beautiful locations — because, for example, a waterfall is where there is permanent water. So the community would live there for a period of time before moving to the next beautiful place.”": "“澳大利亚发生的大多数［针对原住民的］屠杀都在美丽的地方——比如瀑布，因为那里有长年不断的水。部落会在那里生活一段时间，再迁往下一个美丽的地方。”", "Ben Quilty, Australian artist and social commentator": "Ben Quilty，澳大利亚艺术家、社会评论家", "At eleven, Quilty saw Johnstone’s Evening Shadows: a classic colonial picture of Australia, a young Indigenous woman with a baby on her back on the riverbank opposite a camp, where a younger and an older man sit by a fire. As Quilty tells it, by the time it was painted the Ngarrindjeri people of that country had been devastated by smallpox. Quilty’s reply, Rorschach after Johnstone, flattens the paint into mirrored, unrecognisable shapes that tell stories too hard to look at directly.": "十一岁时，Quilty 看到了 Johnstone 的《暮影》：一幅典型的殖民时期澳大利亚图景，一位背着婴儿的年轻原住民女子站在河岸上，对岸是营地，一老一少两个男人坐在火边。按 Quilty 的讲述，这幅画完成时，那片土地上的 Ngarrindjeri 人已被天花重创。Quilty 的回应《仿 Johnstone 的罗夏墨迹》把颜料压平成镜像、难以辨认的形状，讲述那些难以直视的故事。", "Ben Quilty, Evening Shadows, Rorschach after Johnstone. Supplied: Art Gallery of South Australia.": "Ben Quilty，《暮影，仿 Johnstone 的罗夏墨迹》。图片提供：南澳大利亚美术馆。", "Gathering by the water": "水边相聚", "Water and its sources recur across the engagement and are a common thread through Indigenous Australian cultures. Beyond the shared grief over the Frontier Wars, the design makes water its central motif. The pool in the excavation recalls the rain-filled hollows of quarries, but above all it is a symbolic source for retracing cultural memory: an experience of seeking where the dreaming begins.": "水及其源头在多次交流中反复出现，是澳大利亚原住民文化的共同线索。在边疆战争共同的悲痛之外，设计以水为核心主题。开挖中的水池令人想起采石场积雨的洼地，但更重要的是，它是追溯文化记忆的象征性源头：一种寻找梦创时代起点的体验。", "The spatial sequence recreates the practice of gathering by the water. Visitors are drawn toward a sunken, magnetic core that stands for historical gathering sites. But the water here is absent or ephemeral, turning a scene of joyful gathering into one of loss and reflection.": "空间序列重现了在水边相聚的习俗。访客被引向一个下沉的、充满吸引力的核心，象征历史上的聚集地。但这里的水是缺席的、短暂的，把欢聚的场景转变为失去与反思。", "Big idea: read the terrain, read the history. The Shrine’s story above; the billabong below.": "核心概念：阅读地形，阅读历史。上方是纪念馆的故事；下方是水塘。", "Concept and form": "概念与形式", "Who do we commemorate? The Aboriginal lives lost in the Frontier Wars. How? By giving up the eternal monument and excavating a void. The sunken pit is the most direct architectural translation of forgetting: not an object but an imprint of absence.": "我们纪念谁？在边疆战争中逝去的原住民生命。如何纪念？放弃永恒的纪念碑，挖出一个虚空。下沉的坑是“遗忘”最直接的建筑转译：不是一个物体，而是缺席留下的印记。", "It respects the Shrine’s formal axis while rupturing it with an inward spiral, drawn from Indigenous cyclical time, where history is not linear and the weight of an event keeps resonating regardless of its distance. The building lives in between: remembrance and forgetting, above and below ground, official history and silent truth.": "它尊重纪念馆的形式轴线，又以一道向内的螺旋打破它；螺旋源自原住民的循环时间观，历史并非线性，一个事件的分量无论相隔多远都持续回响。建筑处于“之间”：铭记与遗忘、地上与地下、官方历史与沉默的真相。", "Griffith University, Indigenous Champion Service Role": "格里菲斯大学，原住民倡导服务角色", "Interpretive centre functions: the visitors’ entrance, the Shrine’s axis, cyclical time.": "诠释中心功能：访客入口、纪念馆轴线、循环时间。", "Paths and pauses: circulation leads through scrim partitions that hold the view at a distance, so the body has to move to see clearly. The last pause is around the central shallow water mirror, the core space for gathering and contemplation.": "路径与停顿：流线穿过纱幔隔断，让视线保持距离，身体必须移动才能看清。最后的停顿在中央的浅水镜周围，这是聚集与沉思的核心空间。", "Ground": "地面层", "−1 Mezzanine": "−1 夹层", "Close reading": "细读", "Rock art can be seen from a distance, but reading it truly means approaching the water. The descriptions of the permanent exhibits are etched into the granite bed of the pool. To read them you must come close, even bow your head, and use your body to block the glare. Lowering the head, leaning towards the water, straining to decipher: the act itself is a ritual of mourning.": "岩画可以远观，但要真正读懂，就必须走近水面。常设展品的说明刻在水池的花岗岩池底。要读它们，你必须靠近，甚至低下头，用身体挡住反光。低头、俯身向水、费力辨认：这一动作本身就是一种哀悼的仪式。", "Along the way, geological layers rise on your left, community rock art appears through openings above, and the shadows of people move faintly behind mesh screens like fragments of memory. You have to move to piece things together.": "沿途，地质层在你左侧升起，社区岩画从上方开口中显现，人的影子在网幕后若隐若现，像记忆的碎片。你必须移动，才能拼凑出全貌。", "Reading at the water’s edge.": "在水边阅读。", "Sections": "剖面", "Cross section through the Shrine and the sunken courtyard.": "穿过纪念馆与下沉庭院的横剖面。", "Long section along the forecourt.": "沿前庭的长剖面。", "Materials": "材料", "Timber decking": "木平台", "Spotted gum absorbs and keeps water stains over time. Laid in the shallow water zones and along the water’s path, each stain marks a visitor who paused, leaned in and bowed their head to read: a physical trace of remembrance.": "斑皮桉会随时间吸收并留下水渍。它铺在浅水区和水流经过的路径上，每一块水渍都标记着一位停下、俯身、低头阅读的访客：铭记的物理痕迹。", "Black mirror marble": "黑色镜面大理石", "A reflective surface that draws the sky, the architecture and the visitors themselves into the narrative.": "反射的表面，把天空、建筑与访客自己都引入叙事之中。", "Scrim partitions": "纱幔隔断", "They create distance and ambiguity. Faint, overlapping shades suggest a collective experience yet keep individual solitude, and carry projections so historical images float through the space.": "它们制造距离与模糊。淡淡交叠的影子暗示集体的经验，又保留个人的独处；同时承载投影，让历史影像在空间中漂浮。", "Exposed earth walls and red concrete": "裸露的土墙与红色混凝土", "The earth’s waterline is a record of geological time. Locally sourced red concrete echoes the sacred colour of the earth and the blood of history; its rough texture answers the Shrine’s polished granite, and in a semi-open sunken square it keeps costs down.": "土的水位线是地质时间的记录。本地出产的红色混凝土呼应大地神圣的颜色与历史的血色；粗糙的质感回应纪念馆抛光的花岗岩，在半开放的下沉广场中也控制了造价。", "Structural system": "结构体系", "Red concrete structure.": "红色混凝土结构。", "Ephemeral Billabong is not a memorial that gives answers but a forum that asks questions. Through the transient poetry of its materials and the enforced close reading of its spaces, it shows that historical truth does not live in eternal stone; it emerges in fleeting reflections, evaporating water stains, and our shared, active act of remembering. Architecture becomes a verb, a continuous, unfinished act of healing, inviting everyone to bend down, look for their own understanding in the silence and reflections, and take part in the nation’s unfinished reconciliation.": "Ephemeral Billabong 不是一座给出答案的纪念馆，而是一个提出问题的论坛。通过材料短暂的诗意与空间强制的细读，它表明历史的真相不在永恒的石头里；它浮现在转瞬即逝的倒影、蒸发的水渍，以及我们共同的、主动的铭记之中。建筑成为一个动词，一种持续的、未完成的疗愈，邀请每个人俯下身，在沉默与倒影中寻找自己的理解，参与这个国家尚未完成的和解。", "The End of Time": "The End of Time 时间的尽头", "Studies · Education · B.Arch studio": "学习作品 · 教育建筑 · 本科设计课", "Close ✕": "关闭 ✕", "A learning centre that does not want to be one: an extension of the woods.": "一个不想成为学习中心的学习中心：树林的延伸。", "TBC": "待补充", "Individual": "个人", "Institution": "学校", "Paths and existing trees set out a hexagonal grid. Each cell becomes a tree-like structure carrying the floors, so planting and light pass through three storeys of study space.": "道路与现有树木的位置生成六边形网格，每个单元成为承托楼板的树状结构，让绿植与光线穿过三层学习空间。", "Drawings": "图纸", "Ground floor": "首层", "Axonometric": "轴测", "Upper floors": "楼上各层", "Sections & elevations": "剖面与立面", "Site plan": "总平面", "Studies · Landscape & urban design": "学习作品 · 景观与城市设计", "Linear parks that tie the town to nature along its edge.": "沿城市边界、连接城市与自然的带状公园。", "Team": "小组", "Light interventions in the negative spaces along Blanquefort’s edge: a walking and cycling route, abandoned sites turned into a market, cultural squares and wetland parks. Team work at ENSAP Bordeaux with Yongtong Feng, Wenhao Wang, Mingze Ma and Kexin Gao; tutor Laurent Gouyou-Beauchamps.": "以轻微的手法介入布朗克福尔城市边界的消极空间：步行与自行车道，废弃场地转化为市场、文化广场与湿地公园。波尔多国立建筑与景观学院小组作业，组员冯泳通、王文浩、马铭泽、高可欣，导师 Laurent Gouyou-Beauchamps。", "Plan masse": "总平面", "Reading the edge": "阅读边界", "Plan no. 1": "一号平面", "Plan no. 2": "二号平面", "Studies · Sustainability · M.Arch": "学习作品 · 可持续设计 · 硕士", "Keep the concrete frame, re-lay the bricks, re-dress the facades.": "保留混凝土框架，重砌砖块，重塑立面。", "University of Melbourne": "墨尔本大学", "A campus building retrofitted for operational and embodied carbon: the frame stays, demolished bricks return, a tilted west facade with light pipes and a green double skin to the east. Mixed-mode ventilation saves about 35% of energy a year.": "以运行碳与隐含碳为依据改造一栋校园建筑：保留框架，回收拆除的砖，西立面倾斜并引入导光管，东侧形成绿色双层表皮。混合通风每年节能约 35%。", "Thermal comfort and zoning": "热舒适与分区", "Public areas run through the middle of the plan for cross ventilation.": "公共区域贯穿平面中部，形成穿堂风。", "Consultation and therapy rooms touch the facade for natural ventilation and daylight.": "诊疗室与治疗室贴近立面，获得自然通风与采光。", "Toilets and change rooms take the darker middle zone, leaving light and air to the rooms that need them.": "卫生间与更衣室占据较暗的中部，把光与空气留给需要它们的房间。", "Utility areas keep a visual connection to the outside.": "辅助用房与室外保持视线联系。", "Circulation": "流线", "Staff, patients and visitors move on separate routes; patient rooms open to the facade.": "员工、患者与访客各走各的路线；患者用房向立面打开。", "Staff space": "员工空间", "Patient space": "患者空间", "Staff route": "员工流线", "Visitor route": "访客流线", "Ventilation": "通风", "Windows and screens let each room control its own air; across the plan, air moves by indoor convection.": "窗与纱窗让每个房间自行控制通风；在整个平面上，空气依靠室内对流流动。", "Self-controlled window ventilation": "自主控制的开窗通风", "Indoor air convection": "室内空气对流", "Visual comfort": "视觉舒适", "Average daylight factor: 5–10% along the sawtooth facade, over 10% at the open ends, 1–2% in the core rooms, under 1% in the toilets.": "平均采光系数：锯齿形立面一侧 5–10%，两端开敞处超过 10%，核心房间 1–2%，卫生间低于 1%。", "High daylight, skylight": "高采光，天窗", "Mainly daylight": "以自然光为主", "Mainly artificial light": "以人工照明为主", "Highly artificial light": "高度依赖人工照明", "Acoustics": "声学", "Absorbent finishes follow the noise of each zone. Quiet focus rooms sit to the west, the operational core in the middle and collaborative space by the windows, matching the noise zones outside. Acoustic panels form the partition walls.": "吸声饰面按各区的噪声配置。安静的专注空间位于西侧，操作核心居中，协作空间靠窗，与室外的噪声分区相对应。隔墙由吸声板构成。", "Toilets and noisy space · 65 dB": "卫生间与嘈杂空间 · 65 dB", "Office · 40 dB": "办公 · 40 dB", "Physio rooms · 35 dB": "理疗室 · 35 dB", "Entertainment · 20 dB": "娱乐 · 20 dB", "Acoustic panel partitions": "吸声板隔墙", "Biophilic design": "亲自然设计", "Planting in the core and at both ends; therapy rooms and workspaces keep views to greenery inside and out.": "核心与两端布置绿植；治疗室与工作区都能看到室内外的绿色。", "Indoor greenery": "室内绿植", "Views to indoor greenery": "望向室内绿植的视线", "Views to outdoor greenery": "望向室外绿植的视线", "Final fit-out": "最终室内布置", "Connection to nature": "与自然的联系", "Physical wellbeing": "身体健康", "Thermal comfort": "热舒适", "Cooperation, socialising, concentration, breakthrough": "协作、社交、专注、突破", "Facade, exploded axonometric": "立面，爆炸轴测", "Operational carbon": "运行碳", "Retrofit proposal": "改造方案", "User profiles": "使用者画像", "Active design principles": "主动设计原则", "IEQ before and after": "改造前后的室内环境质量", "Objects · Metalwork · Product": "物件 · 金属工艺 · 产品", "Metal not as a container for light, but as what changes it.": "金属不是盛放光的容器，而是改变光的材料。", "We bent, pressed, hammered, polished, heated and layered aluminium, brass, galvanised steel, mild steel and mesh to see how geometry, texture, finish and permeability change reflection, shadow and diffusion. The lamp emerged from fabrication rather than from a set form: one light source, redirected, scattered, coloured and partly absorbed by the metal around it. ExLab: Experimental Furniture Futures, with Joey Chan.": "我们对铝、黄铜、镀锌钢、低碳钢与金属网进行弯折、冲压、锤打、抛光、加热与叠层，观察几何、肌理、表面处理与透光性如何改变反射、阴影与漫射。灯的形态从加工中生成：同一光源被周围的金属改向、散射、染色并部分吸收。ExLab 实验家具课程，与 Joey Chan 合作。", "Operations": "材料操作", "Bend, hammer, polish, heat, layer.": "弯、锤、磨、烧、叠。", "Each operation changes how the same light behaves. Click any image to read what we did.": "每一种操作都改变同一束光的表现。点开任意一张图，看我们做了什么。", "Bending and pressing": "弯折与冲压", "Geometry through controlled force": "以受控的力获得几何", "— A press brake gives controlled bends at repeatable angles; a printed profile sets a specific angle, and a mould presses sheet into more specific forms. Internal supports must follow the direction of force to avoid unwanted deformation.": "— 折弯机可以在可重复的角度上获得受控的折弯；打印的轮廓用来确定特定角度，模具把板材压成更具体的形状。内部支撑必须顺着受力方向，以免产生不必要的变形。", "U profile": "U 形截面", "Curvature": "曲率", "— The same curve in aluminium, brass, galvanised and mild steel showed different rigidity, spring-back and surface. Repeated, it became a simple reflector: as the light moved, each curve concentrated highlight and shadow differently.": "— 同一条曲线用在铝、黄铜、镀锌钢与低碳钢上，表现出不同的刚度、回弹与表面。重复排列后，它成为简单的反光器：光源移动时，每条曲面聚集高光与阴影的方式都不同。", "Fold": "折叠", "Angle controls light direction": "角度控制光的方向", "— A sharp fold makes two directional surfaces from one sheet. The angle sets both the direction of reflection and the depth of shadow; repeated, a fold becomes a system for directing light.": "— 一道锐利的折痕把一张板变成两个有方向的面。角度同时决定反射的方向与阴影的深度；重复之后，折叠成为引导光线的系统。", "Hammering": "锤打", "From reflection to scattering": "从反射到散射", "— Hammering breaks a flat mirror into many small facets, so light scatters into many highlights instead of one. Texture and form develop at the same time.": "— 锤打把平整的镜面打碎成许多小切面，光不再只有一个高光，而是散成许多。肌理与形态同时生成。", "Polishing": "抛光", "Surface finish as an optical variable": "表面处理作为光学变量", "— From 36 grit to 80–120 grit: coarse finishes keep directional marks, fine ones give a continuous reflection. Direction matters as much as intensity; parallel strokes hold a highlight, crossed or rotated strokes fragment it.": "— 从 36 目到 80–120 目：粗糙的处理保留方向性划痕，细腻的处理形成连续的反射。方向与力度同样重要；平行的打磨能保持高光，交叉或旋转的打磨则把它打碎。", "Polishing direction": "抛光方向", "Crossed, doubled, irregular, radial": "交叉、叠加、无规则、放射", "— Changing the direction of abrasion gives the same sheet controlled, radial or fragmented reflections.": "— 改变打磨方向，同一张板就能产生受控的、放射的或碎片化的反射。", "Heat": "加热", "Colour through material reaction": "材料反应产生的颜色", "— Heating mild steel brought out gold, brown, blue and dark areas according to the heat. Colour is not applied as a coating; it is a direct result of the process.": "— 加热低碳钢，依热度不同出现金、棕、蓝与深色区域。颜色不是涂上去的，而是加工过程的直接结果。", "Heat and reflection": "加热与反射", "One surface, many optical conditions": "一个表面，多种光学状态", "— Heated, polished and untreated zones on one galvanised sheet: bright areas stay responsive to light, oxidised ones absorb it, so reflectivity can be graded across a single surface.": "— 在一张镀锌钢板上结合加热、抛光与未处理的区域：明亮处对光保持敏感，氧化处则吸收光，反射率因此可以在一个连续表面上渐变。", "Mesh": "金属网", "Transparency through metal": "金属的透明", "— Mesh lets light through while the metal stays visible, casting patterned shadow. Layering or curving it thickens the effect.": "— 金属网让光透过，金属本身依然可见，投下图案化的阴影。叠层或弯曲会让效果更加浓密。", "Combinations": "组合", "Contrast through surface, colour and permeability": "表面、颜色与透光性的对比", "— Reflective and matte, smooth and hammered, warm and cool, solid and perforated panels were paired, to see how neighbours change the reading of light and form.": "— 反光与哑光、光滑与锤纹、暖与冷、实心与穿孔的板材被并置在一起，观察相邻的材料如何改变对光与形的阅读。", "What we learned": "我们学到了什么", "Bend": "弯折", "redirects light": "改变光的方向", "Polish": "抛光", "controls reflection": "控制反射", "Hammer": "锤打", "scatters light": "散射光线", "alters colour and absorption": "改变颜色与吸收", "filters light, casts shadow": "过滤光线，投下阴影", "Fabrication": "加工", "Laser cut": "激光切割", "Surface treatment: polishing and hammering": "表面处理：抛光与锤打", "Press forming over 3D-printed moulds": "在 3D 打印模具上压制成型", "Heating: introducing colour": "加热：引入颜色", "Assembly and light testing": "组装与灯光测试", "Action and manipulation": "动作与操作", "Form finding: repetition and redirection": "找形：重复与改向"}};
