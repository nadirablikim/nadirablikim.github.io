<title>Nadira Ablikim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500&family=Newsreader:ital,opsz,wght@1,6..72,400&display=swap">
<style>
/* Layout: gallery. Slider of key projects with overlaid captions, then an index grid. Project view scrolls endlessly with a hidden left index. */
:root{
  --bg:#EFEEEA;       /* warm grey-white */
  --bg-2:#E6E5E0;
  --fg:#151514;
  --mute:#85847E;
  --rule:#D6D5CF;
  --on-img:#FFFFFF;
  /* Latin: Helvetica. Chinese: Hiragino Sans GB (冬青黑体). Both ship with macOS; others fall back to Arial / Noto Sans SC. */
  --f:"Helvetica Neue",Helvetica,"Hiragino Sans GB","冬青黑体简体中文","冬青黑体",Arial,"Noto Sans SC","Microsoft YaHei",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1480px;margin:0 auto;padding-inline:clamp(16px,3vw,40px)}
a{color:inherit;text-decoration:none}
:focus-visible{outline:1.5px solid var(--fg);outline-offset:3px}
.mute{color:var(--mute)}
.todo{color:var(--mute);font-style:italic}

header{position:fixed;left:0;right:0;top:0;padding-top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);transition:background .3s,color .3s}
body.over header{background:transparent;color:var(--on-img)}
body.over .langs button{color:rgba(255,255,255,.65)}body.over .langs button[aria-pressed="true"]{color:var(--on-img)}body.over .sep{background:rgba(255,255,255,.4)}
main{padding-top:92px}body.home main{padding-top:0}
header .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-block:14px;flex-wrap:wrap}
.name{font-weight:600;display:flex;align-items:center;gap:12px}
.logo{height:52px;width:auto;display:block;flex:none}
nav{display:flex;align-items:center;gap:clamp(14px,2.4vw,32px);flex-wrap:wrap}
nav a:hover,.langs button:hover{color:var(--mute)}
.langs{display:flex;gap:10px}
.langs button{font:inherit;background:none;border:0;padding:0;color:var(--mute);cursor:pointer}
.langs button[aria-pressed="true"]{color:var(--fg)}
.sep{width:1px;height:12px;background:var(--rule)}

/* placeholders */
.ph{position:relative;width:100%;max-width:100%;overflow:hidden;background:var(--tone)}
.ph[data-label]::after{content:attr(data-label);position:absolute;right:12px;top:10px;font-size:11px;letter-spacing:.04em;color:rgba(255,255,255,.8)}
.t-conc{--tone:linear-gradient(160deg,#C9C6BF,#8E8B85)}
.t-brick{--tone:linear-gradient(160deg,#D3B29B,#94664F)}
.t-earth{--tone:linear-gradient(160deg,#E0D0B1,#A58E68)}
.t-tile{--tone:linear-gradient(160deg,#A5ACAB,#5B6364)}
.t-timber{--tone:linear-gradient(160deg,#A9B7A6,#58695A)}

/* slider */
.slider{position:relative;overflow:hidden;height:100svh;min-height:420px;width:100%;background:var(--bg-2)}
.track{display:flex;height:100%;transition:transform .7s cubic-bezier(.7,0,.2,1)}
.slide{flex:0 0 100%;height:100%;position:relative;display:block}
.slide .ph{height:100%}
.slide .ov{position:absolute;inset:auto 0 0 0;padding:clamp(18px,3vw,40px) clamp(48px,5vw,72px);color:var(--on-img);background:linear-gradient(transparent,rgba(0,0,0,.38));display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
.ov h2{font-size:clamp(1.4rem,3vw,2.4rem);font-weight:500;line-height:1.1;margin:0 0 6px;text-wrap:balance}
.ov p{margin:0;max-width:48ch;opacity:.92}
.ov .k{font-size:13px;opacity:.85;white-space:nowrap}
.zone{position:absolute;top:0;bottom:0;width:50%;background:none;border:0;padding:0;z-index:2}
.zone.l{left:0;cursor:w-resize}.zone.r{right:0;cursor:e-resize}
.slide-link{position:absolute;inset:0;z-index:1}
.chev{position:absolute;top:50%;transform:translateY(-50%);z-index:3;background:none;border:0;padding:12px;color:var(--on-img);font:inherit;font-size:30px;font-weight:300;line-height:1;cursor:pointer;opacity:.85}
.chev:hover{opacity:1}.chev.l{left:clamp(4px,1.5vw,20px)}.chev.r{right:clamp(4px,1.5vw,20px)}
.slider .count{position:absolute;right:clamp(18px,3vw,40px);top:calc(env(safe-area-inset-top,0px) + 96px);z-index:3;color:var(--on-img);font-size:13px}
.count{font-variant-numeric:tabular-nums}

.shead{display:flex;justify-content:space-between;gap:16px;padding-top:clamp(72px,9vw,140px);padding-bottom:20px;color:var(--mute)}
.grid{display:flex;flex-direction:column;gap:clamp(40px,5vw,72px)}
.row{display:grid;gap:clamp(12px,1.2vw,18px)}
.row.a{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
.row.b{grid-template-columns:minmax(0,2fr) minmax(0,3fr)}
.card{display:block;min-width:0}
.card .frame{position:relative}
.card .ph{height:clamp(260px,38vw,620px)}
.row.full .card .ph{height:clamp(300px,50vw,820px)}
.card .hov{position:absolute;inset:auto 0 0 0;padding:16px 18px;color:var(--on-img);background:linear-gradient(transparent,rgba(0,0,0,.35));opacity:0;transition:opacity .35s;text-align:right}
.card:hover .hov,.card:focus-visible .hov{opacity:1}
.cap{display:flex;justify-content:space-between;gap:16px;padding-top:12px}
.cap b{font-weight:500}

section.block{padding-top:clamp(96px,12vw,180px);scroll-margin-top:70px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:clamp(24px,4vw,64px)}
.bio p{margin:0 0 1em;max-width:56ch;font-size:1.06rem}
.rows{list-style:none;margin:28px 0 0;padding:0;max-width:640px}
.rows li{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:16px;padding:10px 0;border-top:1px solid var(--rule)}
.rows li span:first-child{font-variant-numeric:tabular-nums;color:var(--mute)}
.contact{display:flex;flex-direction:column;gap:6px;font-size:clamp(1.25rem,2.2vw,1.75rem)}
.contact a:hover{color:var(--mute)}
.copy{font:inherit;font-size:13px;background:none;border:0;padding:0;color:var(--mute);cursor:pointer;margin-left:10px}
footer{padding-block:clamp(96px,10vw,160px) 32px;display:flex;justify-content:space-between;color:var(--mute);font-size:13px;gap:16px;flex-wrap:wrap}

/* project view */
#detail article{padding-bottom:clamp(80px,10vw,160px)}
#detail article+article{border-top:1px solid var(--rule);padding-top:clamp(48px,6vw,80px)}
.ph.hero{aspect-ratio:16/9}
.dhead{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:clamp(24px,4vw,64px);padding-block:28px 0}
.dhead h1{font-size:clamp(1.5rem,2.6vw,2.1rem);font-weight:500;line-height:1.15;margin:0;text-wrap:balance}
.meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:20px}
.meta div{min-width:0}
.dtext p{margin:0 0 1em;max-width:60ch;font-size:1.06rem}
.dtext ol{margin:0;padding-left:1.2em;max-width:60ch}
.dtext ol li{padding-left:.3em;margin-bottom:.5em}
.gal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,1.6vw,24px);margin-top:clamp(48px,6vw,96px)}
.gal .ph{aspect-ratio:4/5}
.gal .ph.w{grid-column:1/-1;aspect-ratio:16/8}
#more{height:1px}

/* hidden left index */
.idxtab{position:fixed;left:0;top:50%;transform:translateY(-50%);z-index:30;writing-mode:vertical-rl;font:inherit;font-size:12px;letter-spacing:.14em;text-transform:uppercase;background:var(--fg);color:var(--bg);border:0;padding:14px 7px;cursor:pointer}
html[lang="zh-Hans"] .idxtab{letter-spacing:.3em}
.idx{position:fixed;left:0;top:0;bottom:0;width:min(340px,86vw);z-index:31;background:var(--bg);border-right:1px solid var(--rule);padding:calc(env(safe-area-inset-top,0px) + 100px) 24px 24px;transform:translateX(-100%);transition:transform .35s ease;overflow-y:auto}
.idx.open{transform:none;box-shadow:12px 0 40px rgba(0,0,0,.06)}
.idx h3{font-size:13px;font-weight:500;color:var(--mute);margin:0 0 14px}
.idx ol{list-style:none;margin:0;padding:0}
.idx li a{display:block;padding:12px 0;border-top:1px solid var(--rule)}
.idx li a:hover b,.idx li a[aria-current="true"] b{text-decoration:underline;text-underline-offset:3px}
.idx b{font-weight:500;display:block}
.idx .j{font-size:12.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.idx .back{display:inline-block;margin-top:20px;font-size:13px}
.idxbtn{position:fixed;left:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:32;font:inherit;font-size:13px;background:var(--fg);color:var(--bg);border:0;padding:8px 12px;cursor:pointer;display:none}

@media (max-width:760px){
  .gal{grid-template-columns:minmax(0,1fr)}
  .row.a,.row.b{grid-template-columns:minmax(0,1fr)}
  .card .ph,.row.full .card .ph{height:auto;aspect-ratio:4/3}
  .card .hov{opacity:1}
  .two,.dhead{grid-template-columns:minmax(0,1fr)}
  .rows li{grid-template-columns:72px minmax(0,1fr)}
  .rows li span:last-child{grid-column:2}
  .meta{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
}
@media (hover:none),(max-width:760px){.idxtab{display:none}.idxbtn{display:block}}
@media (prefers-reduced-motion:reduce){.track,.idx,.card .ph{transition:none}html{scroll-behavior:auto}}

/* secondary tiers */
.tier{padding-top:clamp(72px,9vw,140px)}
.tier .shead{padding-top:0}
.mini{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(12px,1.4vw,20px);row-gap:clamp(28px,3vw,40px)}
.mini.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.mini button{all:unset;cursor:pointer;display:block;min-width:0}
.mini button:focus-visible{outline:1.5px solid var(--fg);outline-offset:3px}
.mini .ph{aspect-ratio:4/3;transition:opacity .3s}
.mini.sq .ph{aspect-ratio:1/1}
.mini button:hover .ph{opacity:.85}
.mini .cap{flex-direction:column;gap:2px;padding-top:10px}
.mini .cap span{font-size:13px}
.badge{position:absolute;left:10px;top:10px;background:var(--bg);color:var(--fg);font-size:11.5px;padding:3px 8px;letter-spacing:.02em}
.t-neu{--tone:linear-gradient(160deg,#C4C2BC,#8F8D87)}
.t-sand{--tone:linear-gradient(160deg,#D9D2C3,#A39985)}
.t-steel{--tone:linear-gradient(160deg,#B9BEC2,#6E757B)}
.t-green{--tone:linear-gradient(160deg,#B7C2B0,#6F7F69)}
.wlist{list-style:none;margin:0;padding:0}
.wlist li{border-top:1px solid var(--rule)}
.wlist li:last-child{border-bottom:1px solid var(--rule)}
.wlist button,.wlist a.wlink{all:unset;cursor:pointer;display:grid;grid-template-columns:110px minmax(0,1fr) minmax(0,1fr) 20px;gap:16px;width:100%;padding:14px 0;box-sizing:border-box}
.wlist a.wlink:hover b,.wlist button:hover b{color:var(--mute)}
.wlist button:focus-visible{outline:1.5px solid var(--fg)}
.wlist b{font-weight:500}
.wlist .yr{color:var(--mute);font-variant-numeric:tabular-nums}
.wlist .pm{color:var(--mute);text-align:right}
.wlist .body{padding:0 0 18px 126px;max-width:calc(126px + 60ch)}
.wlist .body p{margin:0 0 .9em}
.wlist .body.withimg{display:grid;grid-template-columns:180px minmax(0,1fr);gap:24px;max-width:calc(126px + 180px + 24px + 60ch)}
.wlist .body img{width:100%;height:auto;border:1px solid var(--rule)}
.wlist li.minor b{font-weight:400;color:var(--mute)}

/* lightbox */
.lb{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 20px) clamp(16px,3vw,40px) calc(env(safe-area-inset-bottom,0px) + 40px)}
.lb .in{max-width:1100px;margin:0 auto}
.lb .top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-bottom:20px}
.lb .x{font:inherit;background:none;border:0;padding:6px 0;cursor:pointer;color:var(--fg)}
.lb .x:hover{color:var(--mute)}.lb .x:focus{outline:none}
.lb .ph.big{aspect-ratio:16/10}
.lb .pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,1.4vw,20px);margin-top:clamp(12px,1.4vw,20px)}
.lb .pair .ph{aspect-ratio:4/3}
.lb .txt{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:clamp(24px,4vw,64px);padding-top:28px}
.lb h2{font-size:clamp(1.4rem,2.4vw,1.9rem);font-weight:500;line-height:1.15;margin:0 0 16px;text-wrap:balance}
.lb .meta{margin-top:0}
.lb p{margin:0;max-width:60ch;font-size:1.06rem}
body.lock{overflow:hidden}

/* contact */
.status{font-size:13px;color:var(--mute);margin-bottom:18px}
.status i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#4F8A5B;margin-right:8px;vertical-align:1px;font-style:normal}
.clist{list-style:none;margin:0;padding:0;max-width:720px}
.clist li{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:16px;align-items:baseline;padding:12px 0;border-top:1px solid var(--rule)}
.clist li:last-child{border-bottom:1px solid var(--rule)}
.clist .v{font-size:clamp(1.05rem,1.6vw,1.3rem);word-break:break-word}
.clist a:hover{color:var(--mute)}
.idx h4{font-size:12px;font-weight:500;color:var(--mute);margin:22px 0 4px;letter-spacing:.04em;text-transform:uppercase}
.idx h4:first-of-type{margin-top:0}

@media (max-width:1000px){.mini{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:760px){
  .mini,.mini.three{grid-template-columns:repeat(2,minmax(0,1fr))}
  .lb .txt{grid-template-columns:minmax(0,1fr)}
  .wlist button{grid-template-columns:64px minmax(0,1fr) 20px}
  .wlist button .ctx{display:none}
  .wlist .body{padding-left:80px}
  .wlist .body.withimg{grid-template-columns:minmax(0,1fr);padding-left:0}
  .wlist .body img{max-width:200px}
  .clist li{grid-template-columns:80px minmax(0,1fr)}
  .clist li>*:last-child:not(:nth-child(2)){grid-column:2}
}

/* manifesto page: editorial reading column, rotated part label at left, figures bleed wider than text */
#mpage{--ind:clamp(0px,14vw,220px);--col:600px;--label:#CAC9C3;padding-bottom:40px}
#mpage .ch{display:grid;grid-template-columns:48px minmax(0,1fr);column-gap:clamp(12px,2.4vw,40px);margin-top:clamp(72px,9vw,128px);padding-top:clamp(48px,6vw,88px);border-top:1px solid var(--rule)}
#mpage .mp-hero{margin-top:clamp(16px,3vw,40px)}
.ch-label{position:relative}
.ch-label span{position:sticky;top:104px;display:block;writing-mode:vertical-rl;transform:rotate(180deg);font-size:clamp(1.15rem,1.8vw,1.6rem);font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--label);white-space:nowrap;line-height:1}
.ch-label::before{content:"";position:absolute;left:0;top:-8px;width:44px;height:1px;background:var(--label);transform-origin:left;transform:rotate(-45deg) translateX(-6px)}
.ch-body{padding-left:var(--ind);min-width:0}
.ch-body>*{max-width:var(--col)}
.ch-h{font-size:clamp(1.25rem,1.9vw,1.55rem);font-weight:500;letter-spacing:.03em;text-transform:uppercase;line-height:1.15;margin:0 0 28px}
html[lang="zh-Hans"] .ch-h{letter-spacing:.08em}
.node{display:block;font-size:11.5px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;margin:44px 0 14px;color:var(--fg)}
.ch-h+.node{margin-top:8px}
#mpage p{font-size:14.5px;line-height:1.78;margin:0 0 1.1em}
#mpage p.strong{font-weight:500}
#mpage p.lead{font-size:clamp(1.4rem,2.2vw,1.8rem);line-height:1.25;font-weight:500;margin-bottom:.8em}
#mpage p.drop::first-letter{float:left;font-size:4.1em;line-height:.8;font-weight:500;margin:.06em .08em 0 0}
#mpage p.aside{font-size:12px;line-height:1.55;color:var(--mute);margin-top:-.2em}
#mpage figure{margin:28px 0 32px}
#mpage figure img{display:block;width:100%;height:auto}
#mpage figure.sm{max-width:240px;margin:6px 0 18px}
#mpage .bleed{max-width:none;margin-left:calc(var(--ind) * -1);width:min(calc(100% + var(--ind)),calc(var(--col) + var(--ind) + 220px))}
#mpage figcaption{font-size:12px;line-height:1.5;color:var(--mute);padding-top:10px;max-width:var(--col)}
#mpage .bleed figcaption{margin-left:var(--ind)}
.mp-hero .hero-in{padding-left:var(--ind);display:grid;grid-template-columns:minmax(0,var(--col)) minmax(180px,260px);gap:clamp(24px,4vw,64px);align-items:start}
.kick{font-size:11.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--mute)}
.mp-hero h1{font-size:clamp(2.6rem,5.4vw,4.4rem);font-weight:500;text-transform:uppercase;letter-spacing:.01em;line-height:.95;margin:14px 0 14px}
.mp-sub{font-size:15px!important;max-width:34ch}
.mp-note{font-size:12px!important;color:var(--mute)}
.hmeta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 24px;margin:24px 0 0;padding-top:16px;border-top:1px solid var(--rule)}
.hmeta dt{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.hmeta dd{margin:2px 0 0;font-size:14px}
.hero-cover{margin:0!important}
.hero-cover img{box-shadow:0 10px 30px rgba(0,0,0,.12)}
.hero-cover figcaption{font-size:13px!important;color:var(--fg)!important;font-weight:500}
.rules{list-style:none;counter-reset:r;margin:0;padding:0}
.rules li{counter-increment:r;border-top:1px solid var(--rule);padding:16px 0 6px}
.rules li .node{margin:0 0 8px}
.rules li .node::before{content:counter(r,decimal-leading-zero) "  ";color:var(--mute)}
.ptable{overflow-x:auto}
.ptable table{border-collapse:collapse;width:100%;min-width:560px}
.ptable th{text-align:left;font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);padding:0 16px 10px 0;border-bottom:1px solid var(--fg)}
.ptable td{padding:14px 16px 14px 0;border-bottom:1px solid var(--rule);vertical-align:top;font-size:13.5px;line-height:1.55}
.ptable td:first-child{font-weight:500;white-space:nowrap}
.ptable tr.ours td{font-weight:500}
.bib{margin:0;padding-left:1.4em;font-size:12.5px;line-height:1.6;color:var(--mute)}
.bib li{margin-bottom:10px;padding-left:4px;overflow-wrap:anywhere}
.bib li span{color:var(--fg)}
sup{line-height:0}
.fn{display:inline}
.fn,.fnback{font:inherit;font-size:10px;background:none;border:0;padding:0 2px;color:var(--mute);cursor:pointer}
.fnback{font-size:12px}
.fn:hover,.fnback:hover{color:var(--fg)}
@media (max-width:760px){
  #mpage{--ind:0px}
  #mpage .ch{grid-template-columns:minmax(0,1fr)}
  .ch-label span{position:static;writing-mode:horizontal-tb;transform:none;font-size:12px;letter-spacing:.15em;margin-bottom:16px}
  .ch-label::before{display:none}
  .mp-hero .hero-in{grid-template-columns:minmax(0,1fr)}
  .hero-cover{max-width:220px}
  #mpage .bleed{width:100%}
}

/* project pages (from portfolio). Same column logic as the manifesto: text column indented, figures wider */
.proj{--ind:clamp(0px,14vw,220px);--col:620px;padding-bottom:clamp(96px,12vw,180px)}
#detail article.proj+article.proj{border-top:1px solid var(--rule);padding-top:clamp(48px,6vw,80px)}
.phimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.phero{margin:0;position:relative}
.phero img{display:block;width:100%;height:min(82vh,900px);object-fit:cover;background:var(--bg-2)}
.phero figcaption{position:absolute;right:10px;bottom:8px}
.proj code{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;letter-spacing:.04em;color:var(--mute);white-space:nowrap}
.phero code{color:#fff;background:rgba(0,0,0,.35);padding:2px 6px}
.phead{padding:clamp(28px,4vw,48px) 0 0 var(--ind)}
.pnum{font-size:12px;letter-spacing:.15em;color:var(--mute)}
.phead h1{font-size:clamp(2.2rem,5vw,4rem);font-weight:500;line-height:1;letter-spacing:-.01em;margin:10px 0 22px;text-wrap:balance}
.pnote{font-size:12px;color:var(--mute);margin:-10px 0 18px}
.pmeta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px 24px;margin:0;padding-top:16px;border-top:1px solid var(--rule);max-width:calc(var(--col) + 320px)}
.pmeta dt{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--mute)}
.pmeta dd{margin:4px 0 0;font-size:13.5px;line-height:1.45}
.pintro{padding:clamp(36px,5vw,64px) 0 0 var(--ind)}
.pintro p{max-width:var(--col);font-size:14.5px;line-height:1.78;margin:0 0 1.1em}
.pintro.small{padding-top:clamp(20px,3vw,32px)}
.pintro.small p{font-size:13.5px;line-height:1.7;color:var(--fg);max-width:560px}
.psec.pgal{margin-top:clamp(48px,6vw,80px)}
.psec.pgal .pfigs{margin-top:0}
.pintro p.first{font-size:clamp(1.15rem,1.8vw,1.4rem);line-height:1.45;font-weight:400}
.psec{margin-top:clamp(64px,8vw,112px)}
.psec.haspart{margin-top:clamp(96px,12vw,170px)}
.ppart{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);padding-top:12px;border-top:1px solid var(--fg);margin-bottom:clamp(28px,4vw,48px)}
.ph2,.plead,.ptxt,.plist{margin-left:var(--ind);max-width:var(--col)}
.ph2{font-size:clamp(1.1rem,1.6vw,1.35rem);font-weight:500;letter-spacing:.04em;text-transform:uppercase;line-height:1.2;margin-top:0;margin-bottom:22px}
html[lang="zh-Hans"] .ph2{letter-spacing:.04em}
.plead{font-size:clamp(1.1rem,1.6vw,1.3rem);line-height:1.45;margin-bottom:1em}
.ptxt{font-size:14.5px;line-height:1.78;margin-bottom:1.1em}
.plist{margin-top:8px;margin-bottom:8px}
.plist>div{border-top:1px solid var(--rule);padding:12px 0}
.plist dt{font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.plist dd{margin:6px 0 0;font-size:14px;line-height:1.65}
.pfigs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(14px,2vw,28px);margin-top:clamp(28px,4vw,44px)}
.pf{margin:0;min-width:0}
.pf.full{grid-column:1/-1}
.pf.tall img{max-height:88vh;width:auto;max-width:100%}
.pf.tall.solo{grid-column:1/-1;padding-left:var(--ind)}
.pf.tall:not(.solo) img{max-height:none;width:100%}
.pf img{display:block;width:100%;height:auto;background:#fff}
.pf figcaption,.pv-cap{display:flex;justify-content:space-between;gap:16px;align-items:baseline;font-size:12px;line-height:1.5;color:var(--mute);padding-top:9px}
/* plan with viewpoints */
.planview{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:clamp(16px,2.4vw,36px);margin-top:clamp(28px,4vw,44px);align-items:start}
.pv-plan{position:relative}
.pv-plan img{display:block;width:100%;height:auto;background:#fff}
.pv-dot{position:absolute;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;border:2px solid #fff;background:var(--fg);color:var(--bg);font:inherit;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.3);transition:transform .2s}
.pv-dot:hover{transform:translate(-50%,-50%) scale(1.12)}
.pv-dot.on{background:#fff;color:var(--fg);border-color:var(--fg);outline:3px solid rgba(255,255,255,.6)}
.pv-cap{position:static}
.pv-view{position:sticky;top:100px}
.pv-item{margin:0}
.pv-item img{display:block;width:100%;height:auto}
.pv-item figcaption{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;padding-top:10px;font-size:13px;line-height:1.5}
.pv-item figcaption b{font-weight:500}
.pv-item figcaption span{grid-column:1;color:var(--mute);font-size:12.5px}
.pv-item figcaption code{grid-row:1;grid-column:2}
.pv-hint{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:14px 0 0}
@media (max-width:760px){
  .proj{--ind:0px}
  .pmeta{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pfigs,.planview{grid-template-columns:minmax(0,1fr)}
  .pv-view{position:static}
  .phero img{height:auto;max-height:70vh}
}

/* Kashgar custom layout: images fit the screen, offset left/right with white space */
.pflow{display:flex;flex-direction:column;gap:clamp(40px,6vw,96px);margin-top:clamp(28px,4vw,48px)}
.pflow .pf{max-width:100%}
.pflow .pf img{display:block;width:auto;max-width:100%;max-height:84vh;height:auto;background:none}
.pf.l50,.pf.l80,.pf.c66{align-self:flex-start}
.pf.r75,.pf.r80{align-self:flex-end}
.pf.l50{max-width:min(50%,720px)}.pf.l80{max-width:80%}.pf.r75{max-width:75%}.pf.r80{max-width:80%}.pf.c66{max-width:66%;align-self:center}
.pf.huge{width:100%}.pflow .pf.huge img{max-height:none;width:100%}
.rel{position:relative}
.sites{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:clamp(16px,2.4vw,36px);margin-top:clamp(28px,4vw,48px);align-items:start}
.sites-map img{display:block;width:100%;height:auto;max-height:84vh;object-fit:contain}
.site-dot{position:absolute;transform:translate(-50%,-50%);width:22px;height:22px;border-radius:50%;border:2px solid transparent;background:transparent;cursor:pointer;padding:0}
.site-dot:hover,.site-dot.on{border-color:var(--fg);background:rgba(255,255,255,.25);box-shadow:0 0 0 4px rgba(255,255,255,.7)}
.site-photos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;position:sticky;top:100px}
.site-ph{margin:0;cursor:pointer;transition:opacity .25s}
.site-ph img{display:block;width:100%;height:auto;aspect-ratio:1;object-fit:cover}
.site-ph figcaption{display:flex;justify-content:space-between;font-size:12px;padding-top:6px;color:var(--mute)}
.site-ph figcaption b{color:var(--fg);font-weight:600}
.sites:has(.site-ph.on) .site-ph:not(.on){opacity:.35}
.swap .rel>img{display:block;width:100%;height:auto}
.swap-img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:var(--bg);opacity:0;transition:opacity .35s;pointer-events:none}
.swap-img.on{opacity:1}
.swap-zone{position:absolute;border:2px dashed rgba(255,255,255,.95);background:rgba(255,255,255,.08);cursor:pointer;padding:0;z-index:2}
.swap-zone:hover{background:transparent;border-color:transparent}
.swap-zone span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.form2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(16px,2.4vw,36px);margin-top:clamp(28px,4vw,48px);align-items:start}
.form-l{position:sticky;top:96px}
.form-l .pf img{max-height:80vh;width:100%;object-fit:contain}
.form-r{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.pf.tile figcaption{padding-top:4px;justify-content:flex-end}
.mods{margin-top:clamp(28px,4vw,48px);max-width:980px}
.mods-top{display:grid;grid-template-columns:120px repeat(5,minmax(0,1fr));gap:10px}
.mods-top::before{content:""}
.mods-body{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;margin-top:10px}
.mods-left{display:grid;gap:10px;align-content:start}
.mod-t,.mod-l{position:relative;background:#fff;border:1px solid var(--rule);padding:6px;cursor:pointer;font:inherit}
.mod-t img,.mod-l img{display:block;width:100%;height:84px;object-fit:contain}
.mod-t span,.mod-l span{position:absolute;left:6px;top:4px;font-size:11px;font-weight:600}
.mod-t.on,.mod-l.on{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.mods-out{margin:0;background:#fff;border:1px solid var(--rule);display:flex;flex-direction:column}
.mods-out img{display:block;width:100%;height:auto;max-height:62vh;object-fit:contain;padding:20px;box-sizing:border-box}
.mods-out figcaption{display:flex;justify-content:space-between;padding:10px 14px;border-top:1px solid var(--rule);font-size:13px}
.mods-all{margin-top:18px}
.mods-all summary{cursor:pointer;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.mods-all .pf{margin-top:16px}
@media (max-width:760px){
  .sites,.form2{grid-template-columns:minmax(0,1fr)}
  .site-photos,.form-l{position:static}
  .site-photos{grid-template-columns:repeat(3,minmax(0,1fr))}
  .pf.l50,.pf.l80,.pf.r75,.pf.r80,.pf.c66{width:100%}
  .mods-top,.mods-body{grid-template-columns:64px repeat(5,minmax(0,1fr))}
  .mods-body{grid-template-columns:64px minmax(0,1fr)}
  .mod-t img,.mod-l img{height:48px}
}

/* Kashgar v2: slide compositions with generous margins (after Studio Paloma / Cargo references) */
.kx{--gut:clamp(0px,5vw,96px)}
.kx .kslide{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);gap:clamp(32px,5vw,96px);padding:clamp(88px,11vw,160px) var(--gut) 0;align-items:start}
.kx .kslide.wide{display:block}
.kx .s-txt{position:sticky;top:110px;max-width:340px}
.kx .s-k{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin-bottom:10px}
.kx .s-h{font-size:14px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;line-height:1.35;margin:0 0 18px}
.kx .s-txt p{font-size:13px;line-height:1.7;margin:0 0 1em;color:var(--fg)}
.kx .s-txt p.hint{color:var(--mute)}
.kx .s-media{display:flex;flex-direction:column;align-items:center;min-width:0}
.sf{margin:0;max-width:100%}
.sf img{display:block;max-width:100%;max-height:74vh;width:auto;height:auto;margin:0 auto}
.sf figcaption{display:flex;justify-content:space-between;gap:16px;font-size:11.5px;line-height:1.5;color:var(--mute);padding-top:10px}
.sf figcaption i,.st figcaption i{font-style:normal;color:var(--fg);margin-right:10px}
.sf code,.st code{font-family:ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.04em;color:var(--mute);white-space:nowrap}
.sf.m80{max-width:86%}.sf.m55{max-width:55%}
.sf.m55 img{max-height:46vh}
.sf.huge img{max-height:none;width:100%}
.kx .kslide.sect{padding-top:clamp(40px,5vw,64px)}
.kx .kslide.texthead .s-media{display:none}
.kx .kslide.texthead{grid-template-columns:minmax(0,1fr)}
/* render strip: a row of small frames, hover lifts one (reference: Rue Studio) */
.strip{display:flex;align-items:center;justify-content:center;gap:clamp(8px,1vw,16px);height:min(72vh,760px)}
.st{margin:0;flex:0 1 auto;display:flex;flex-direction:column;justify-content:flex-end;min-width:0}
.st img{display:block;height:min(30vh,300px);width:auto;max-width:100%;object-fit:cover;transition:height .45s cubic-bezier(.2,.7,.2,1)}
.st figcaption{font-size:11px;line-height:1.4;color:var(--mute);margin-bottom:10px;opacity:0;transition:opacity .3s;white-space:nowrap}
.st figcaption code{margin-left:10px}
.st:hover img,.st:focus-within img{height:min(62vh,640px)}
.st:hover figcaption{opacity:1}
/* field research: map above, photos in one row below */
.sites2{width:100%}
.sites2 .sites-map img{max-height:66vh}
.site-row{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-top:22px}
.site-row .site-ph img{aspect-ratio:1;object-fit:cover;width:100%;transition:transform .3s}
.site-row .site-ph:hover img,.site-row .site-ph.on img{transform:scale(1.08)}
.site-row .site-ph{position:relative;z-index:0}
.site-row .site-ph:hover{z-index:1}
.sites2:has(.site-ph.on) .site-ph:not(.on){opacity:.45}
/* community formation: swap plan in the text column, tiles on the right */
.kx .kslide.form{grid-template-columns:minmax(0,5fr) minmax(0,7fr)}
.kx .kslide.form .s-txt{max-width:none}
.kx .kslide.form .swap{margin-top:18px}
.kx .kslide.form .swap img{max-height:62vh;width:100%;object-fit:contain}
.swap-zone{border:0!important;background:transparent!important}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;width:100%}
.tiles .sf img{max-height:none;width:100%}
.kx .planview{margin-top:10px}
.kx .mods{margin:0 auto;width:100%;max-width:640px}
.kx .mods .mod-t img,.kx .mods .mod-l img{height:60px}
.kx .mods .mods-out img{max-height:46vh}
.kx .mods-top{grid-template-columns:88px repeat(5,minmax(0,1fr))}.kx .mods-body{grid-template-columns:88px minmax(0,1fr)}
@media (max-width:860px){
  .kx .kslide,.kx .kslide.form{grid-template-columns:minmax(0,1fr);padding-top:72px}
  .kx .s-txt{position:static;max-width:none}
  .strip{height:auto;flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;padding-bottom:8px}
  .st img{height:44vh}.st figcaption{opacity:1}
  .st:hover img{height:44vh}
  .site-row{grid-template-columns:repeat(3,minmax(0,1fr))}
  .sf.m55,.sf.m80{max-width:100%}
}

/* Kashgar v3 */
.collage{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-auto-rows:clamp(40px,5.2vw,80px);gap:clamp(10px,1.2vw,18px);margin:0 calc(var(--gut) * -1)}
.cg{margin:0;position:relative;overflow:hidden;min-width:0}
.cg img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.cg:hover img{transform:scale(1.03)}
.cg figcaption{position:absolute;left:10px;bottom:8px;font-size:11px;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.5);opacity:0;transition:opacity .3s}
.cg figcaption i{font-style:normal;margin-right:8px}.cg figcaption code{color:#fff;opacity:.8;font-size:10px}
.cg:hover figcaption{opacity:1}
.cg.c1{grid-column:1/5;grid-row:1/9}
.cg.c2{grid-column:5/13;grid-row:1/6}
.cg.c3{grid-column:5/9;grid-row:6/13}
.cg.c4{grid-column:9/13;grid-row:6/10}
.cg.c5{grid-column:1/5;grid-row:9/13}
.cg.c5 img{object-position:center 30%}
.cg.c4+.cg.c5{}
.kx .kslide.field{grid-template-columns:minmax(0,3fr) minmax(0,9fr);gap:clamp(24px,3vw,56px)}
.kx .kslide.field .sites-map img{max-height:none;width:100%}
.kx .kslide.field .s-media{align-items:stretch}
.legend{margin:26px 0 0}.legend img{display:block;width:100%;height:auto;mix-blend-mode:multiply}
.legend figcaption{text-align:right;padding-top:4px}
.site-row{gap:14px;margin-top:18px}
.sf.big{max-width:100%}.sf.big img{max-height:86vh;width:100%;object-fit:contain}
.kx .kslide.form{grid-template-columns:minmax(0,1fr) minmax(0,1fr);row-gap:24px}
.kx .kslide.form .s-txt{grid-column:1/-1;position:static;max-width:340px}
.form-plan{position:sticky;top:96px;align-self:start}
.form-plan .swap .rel{display:table;margin:0 auto}
.form-plan .swap .rel .swap-base{display:block;width:auto;max-width:100%;height:auto;max-height:calc(100vh - 150px)}
.form-plan .swap-img{background:var(--bg)}
.form-plan .sf,.form-plan figure{margin:0}
.kx .kslide.modsec{grid-template-columns:minmax(0,2fr) minmax(0,10fr)}
.kx .kslide.modsec .s-txt{max-width:220px}
.kx .kslide.modsec .s-txt p{font-size:12px;color:var(--mute)}
.kx .mods{max-width:900px}
.kx .mods .mod-t img,.kx .mods .mod-l img{height:80px}
.kx .mods .mods-out img{max-height:64vh}
.kx .mods-top{grid-template-columns:110px repeat(5,minmax(0,1fr))}.kx .mods-body{grid-template-columns:110px minmax(0,1fr)}
/* more projects strip at the end of a project */
.more{padding:clamp(40px,5vw,64px) 0 20px;border-top:1px solid var(--rule);margin-top:0}
.more-h{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin-bottom:22px}
.more-row{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:clamp(10px,1.2vw,18px)}
.more-row a{display:block}
.more-row img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;transition:opacity .3s}
.more-row a:hover img{opacity:.8}
.more-row span{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;padding-top:10px}
.more-row span em{font-style:normal;color:var(--mute)}
@media (max-width:860px){
  .collage{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:auto;margin:0}
  .cg{grid-column:auto!important;grid-row:auto!important;aspect-ratio:3/4}
  .cg.c2,.cg.c4{grid-column:1/-1!important;aspect-ratio:16/10}
  .kx .kslide.field,.kx .kslide.form,.kx .kslide.modsec{grid-template-columns:minmax(0,1fr)}
  .form-plan{position:static}
  .more-row{grid-template-columns:repeat(2,minmax(0,1fr))}
}

/* interaction notes: quiet grey line with a small logo-like square */
.ia{display:block;font-size:11.5px;line-height:1.5;color:var(--mute);margin:2px 0 16px;border:0;padding:0}
.ia b{display:none}
.ia-dot{display:inline-block;width:8px;height:8px;margin-right:8px;vertical-align:0;background:linear-gradient(to top right,var(--mute) calc(50% - .6px),var(--bg) calc(50% - .6px),var(--bg) calc(50% + .6px),var(--mute) calc(50% + .6px))}
.pv-hint{display:none}
/* fit to one screen */
.kx .kslide.field .s-media{align-items:center}
.kx .kslide.field .sites2{display:flex;flex-direction:column;align-items:center}
.kx .kslide.field .sites-map{width:auto}
.kx .kslide.field .sites-map img{width:auto;max-width:100%;max-height:calc(100vh - 400px)}
.kx .kslide.field .site-row{width:100%;max-width:820px}
.form-plan .swap-img{object-fit:cover;width:100%;height:100%;max-height:none}
.kx .mods{max-width:min(900px,calc((100vh - 120px) * 1.25))}
.kx .mods .mod-t img,.kx .mods .mod-l img{height:min(56px,6vh)}
.kx .mods .mods-out img{max-height:calc(100vh - 440px);padding:10px}
.kx .mods .mod-t,.kx .mods .mod-l{padding:3px}
.kx .mods .mods-left{gap:6px}.kx .mods-top{gap:6px}.kx .mods-body{gap:6px;margin-top:6px}
.kx .mods-top{grid-template-columns:90px repeat(5,minmax(0,1fr))}.kx .mods-body{grid-template-columns:90px minmax(0,1fr)}

.collage.c3set .cg.d1{grid-column:1/5;grid-row:1/12}
.collage.c3set .cg.d2{grid-column:5/13;grid-row:1/7}
.collage.c3set .cg.d3{grid-column:5/13;grid-row:7/12}
.tgl{width:100%;display:flex;flex-direction:column;align-items:center}
.tgl-tabs{display:flex;gap:18px;margin-bottom:14px;align-self:flex-start}
.tgl-b{font:inherit;font-size:12px;letter-spacing:.08em;text-transform:uppercase;background:none;border:0;border-bottom:1px solid transparent;padding:2px 0;color:var(--mute);cursor:pointer}
.tgl-b.on{color:var(--fg);border-bottom-color:var(--fg)}
.tgl-f img{max-height:calc(100vh - 220px)}
.slist{margin:10px 0 0}
.slist>div{border-top:1px solid var(--rule);padding:9px 0}
.slist dt{font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.slist dd{margin:4px 0 0;font-size:12.5px;line-height:1.6}
@media (max-width:860px){.collage.c3set .cg{grid-column:1/-1!important;grid-row:auto!important;aspect-ratio:4/3}}

.kx .kslide.bgtext{grid-template-columns:minmax(0,4fr) minmax(0,8fr);padding-top:clamp(36px,4vw,56px)}
.kx .kslide.bgtext .s-txt{position:static;max-width:none;grid-column:1/-1;display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);column-gap:clamp(32px,5vw,96px)}
.kx .kslide.bgtext .s-txt>.s-k,.kx .kslide.bgtext .s-txt>.s-h,.kx .kslide.bgtext .s-txt>p{grid-column:1}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=id=>document.getElementById(id);
let L="en";
const tbc=t=>`<span class="todo">${esc(t.tbc)}</span>`;
const v=(x,t)=>x?esc(x):tbc(t);
let ph=(id,cls,label)=>`<div class="ph ${META[id].tone} ${cls||""}" role="img" aria-label="${esc(label||"")}"${label?` data-label="${esc(label)}"`:""}></div>`;
const auTxt=(id,t)=>META[id].au?esc(t.au[META[id].au]):tbc(t);

/* slider */
let S=0,timer=null;
const FEAT=()=>P.filter(p=>META[p.id].featured);
function drawSlider(t){
  const F=FEAT(),one=p=>{const d=p[L];return `<div class="slide${PIMG&&PIMG[p.id]&&PIMG[p.id].fit?" light":""}" data-id="${p.id}" role="group" aria-roledescription="slide">${ph(p.id,"",t.ph)}
    <div class="ov"><div><h2>${esc(d.t)}</h2><p>${esc(t.line[p.id])}</p></div><span class="k">${esc(d.type)}${d.loc?" · "+esc(d.loc):""}</span></div>
    <a class="slide-link" href="#${p.id}" aria-label="${esc(d.t)}"></a></div>`};
  /* clones at both ends make the loop seamless */
  $("track").innerHTML=one(F[F.length-1])+F.map(one).join("")+one(F[0]);
  go(S,false,true);
}
let POS=1;
function place(instant){const tr=$("track");if(instant){tr.style.transition="none";tr.style.transform=`translateX(${-POS*100}%)`;tr.offsetWidth;tr.style.transition=""}else tr.style.transform=`translateX(${-POS*100}%)`}
function go(i,user=true,instant=false){
  const n=FEAT().length;POS=i+1;S=(i+n)%n;place(instant);
  $("count").textContent=`${String(S+1).padStart(2,"0")} / ${String(n).padStart(2,"0")}`;
  try{const id=FEAT()[S].id;document.body.classList.toggle("light-slide",!!(PIMG[id]&&PIMG[id].fit))}catch(e){}
  if(user)restart();
}
$("track").addEventListener("transitionend",e=>{if(e.target!==$("track"))return;const n=FEAT().length;if(POS===0){POS=n;place(true)}else if(POS===n+1){POS=1;place(true)}});
function restart(){clearInterval(timer);if(!matchMedia("(prefers-reduced-motion: reduce)").matches)timer=setInterval(()=>go(S+1,false),3000)}
["prev","prevZ"].forEach(k=>$(k).onclick=()=>go(S-1));
["next","nextZ"].forEach(k=>$(k).onclick=()=>go(S+1));
let tx=null;$("slider").addEventListener("touchstart",e=>tx=e.touches[0].clientX,{passive:true});
$("slider").addEventListener("touchend",e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>40)go(S+(dx<0?1:-1));tx=null});
$("slider").addEventListener("mouseenter",()=>clearInterval(timer));
$("slider").addEventListener("mouseleave",restart);
/* the zones sit above the slide link; a click in the middle third opens the project */
$("slider").addEventListener("click",e=>{if(!e.target.classList.contains("zone"))return;const r=$("slider").getBoundingClientRect(),x=(e.clientX-r.left)/r.width;if(x>.33&&x<.67){e.stopImmediatePropagation();location.hash=FEAT()[S].id}},true);

function home(t){
  drawSlider(t);
  $("nWork").textContent=String(P.length).padStart(2,"0");
  const card=p=>{const d=p[L];return `<a class="card" href="#${p.id}"><div class="frame">${ph(p.id,"",t.ph)}<div class="hov">${esc(t.line[p.id])}</div></div><div class="cap"><b>${esc(d.t)}</b><span class="mute">${esc(d.type)}</span></div></a>`};
  let rows=`<div class="row full">${card(P[0])}</div>`;
  for(let i=1;i<P.length;i+=2){const pair=P.slice(i,i+2);rows+=pair.length===2?`<div class="row ${((i-1)/2)%2?"b":"a"}">${pair.map(card).join("")}</div>`:`<div class="row full">${card(pair[0])}</div>`}
  $("grid").innerHTML=rows;
  $("tl").innerHTML=t.tl.map(([y,a,b])=>`<li><span>${y}</span><span>${esc(a)}</span><span class="mute">${esc(b)}</span></li>`).join("");
  $("lg").innerHTML=t.langs.map(([a,b])=>`<li><span>${esc(b)}</span><span>${esc(a)}</span><span></span></li>`).join("");
}

/* endless project stream */
let order=[],shown=0,obs=null;
function article(p,t,k){
  const d=p[L],m=META[p.id];
  const ops=d.ops.length?`<ol>${d.ops.map(o=>`<li>${esc(o)}</li>`).join("")}</ol>`:`<p class="todo">${esc(t.opsTodo)}</p>`;
  return `<article data-id="${p.id}" id="s-${k}">
    ${ph(p.id,"hero",t.ph+" 01")}
    <div class="dhead">
      <div><h1>${esc(d.t)}</h1>
        <div class="meta"><div><div class="mute">${esc(t.yr)}</div>${v(m.year,t)}</div><div><div class="mute">${esc(t.cat)}</div>${esc(d.type)}</div><div><div class="mute">${esc(t.who)}</div>${auTxt(p.id,t)}</div>
        <div><div class="mute">${esc(t.sLoc)}</div>${v(d.loc,t)}</div></div></div>
      <div class="dtext"><p>${esc(d.bg)}</p><p class="mute" style="margin-top:1.6em">${esc(t.ops)}</p>${ops}</div>
    </div>
    <div class="gal">${ph(p.id,"",t.ph+" 02")}${ph(p.id,"",t.ph+" 03")}${ph(p.id,"w",t.ph+" 04")}</div>
  </article>`;
}
function appendOne(){const t=T[L],p=order[shown%order.length];$("stream").insertAdjacentHTML("beforeend",article(p,t,shown));shown++}
function openStream(id){
  const i=P.findIndex(p=>p.id===id);order=P.slice(i).concat(P.slice(0,i));shown=0;$("stream").innerHTML="";
  appendOne();appendOne();window.scrollTo(0,0);markCurrent(id);
}
obs=new IntersectionObserver(es=>{if(es[0].isIntersecting&&!$("detail").hidden)appendOne()},{rootMargin:"1200px 0px"});
obs.observe($("more"));
const cur=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)markCurrent(e.target.dataset.id)}),{rootMargin:"-45% 0px -50% 0px"});
new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>n.nodeType===1&&cur.observe(n)))).observe($("stream"),{childList:true});

/* left index */
function drawIndex(t){
  $("idxList").innerHTML=P.map(p=>{const d=p[L],m=META[p.id];
    return `<li><a href="#${p.id}" data-id="${p.id}"><b>${esc(d.t)}</b><span class="j">${m.year?esc(m.year):esc(t.tbc)} · ${esc(d.type)} · ${m.au?esc(t.au[m.au]):esc(t.tbc)}</span></a></li>`}).join("");
  $("idxBack").textContent="← "+t.back;
}
function markCurrent(id){document.querySelectorAll("#idxList a").forEach(a=>a.setAttribute("aria-current",a.dataset.id===id))}
const idx=$("idx");let closeT;
const openIdx=()=>{clearTimeout(closeT);idx.classList.add("open")};
const closeIdx=()=>{closeT=setTimeout(()=>idx.classList.remove("open"),250)};
$("idxTab").addEventListener("mouseenter",openIdx);$("idxTab").addEventListener("click",openIdx);
/* edge trigger removed: index opens only from the tab */
idx.addEventListener("mouseenter",openIdx);idx.addEventListener("mouseleave",closeIdx);
$("idxBtn").addEventListener("click",()=>idx.classList.toggle("open"));
idx.addEventListener("click",e=>{const a=e.target.closest("a[data-id]");if(!a)return;e.preventDefault();idx.classList.remove("open");
  const el=document.querySelector(`#stream article[data-id="${a.dataset.id}"]`);
  if(el){el.scrollIntoView({behavior:"smooth"});history.replaceState(null,"","#"+a.dataset.id)}else location.hash=a.dataset.id});

function render(){
  const t=T[L];
  document.documentElement.lang={en:"en",fr:"fr",zh:"zh-Hans",uy:"ug-Latn"}[L];
  document.querySelectorAll("[data-t]").forEach(el=>{const k=el.dataset.t;if(typeof t[k]==="string")el.textContent=t[k]});
  document.querySelectorAll(".langs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===L));
  home(t);drawIndex(t);
  if(!$("detail").hidden){const first=$("stream").querySelector("article");if(first)openStream(first.dataset.id)}
}
function route(){
  const id=location.hash.slice(1),isP=P.some(p=>p.id===id);
  $("home").hidden=isP;$("detail").hidden=!isP;
  $("slider").hidden=isP;document.body.classList.toggle("home",!isP);onScroll();
  idx.classList.remove("open");
  if(isP){openStream(id)}
  else{const el=id&&$(id);el?el.scrollIntoView():window.scrollTo(0,0)}
}
addEventListener("hashchange",route);
function onScroll(){document.body.classList.toggle("over",document.body.classList.contains("home")&&scrollY<$("slider").offsetHeight-80)}
addEventListener("scroll",onScroll,{passive:true});
document.addEventListener("click",e=>{if(idx.classList.contains("open")&&!idx.contains(e.target)&&!e.target.closest("#idxTab,#idxBtn"))idx.classList.remove("open")});
document.addEventListener("keydown",e=>{if(e.key==="Escape")idx.classList.remove("open")});
document.querySelectorAll(".langs button").forEach(b=>b.addEventListener("click",()=>{L=b.dataset.l;try{localStorage.setItem("lang",L)}catch(e){}render()}));
$("copy").addEventListener("click",async e=>{
  const btn=e.currentTarget;
  try{await navigator.clipboard.writeText($("email").textContent);btn.textContent=T[L].copied;setTimeout(()=>btn.textContent=T[L].copy,1600)}
  catch(err){const r=document.createRange();r.selectNodeContents($("email"));const s=getSelection();s.removeAllRanges();s.addRange(r)}
});

  en:{t:"Escape Dimension Manifesto",ctx:"Manifesto · University of Melbourne",d:"Our minds move through the cloud while our bodies stay in static containers of concrete, glass and steel. Architecture is trapped in a three-dimensional prison of its own making.|The manifesto reads architecture in four dimensions: 1D, the shelter that only survives; 2D, the plan that orders power and movement; 3D, the experience vessel, from Kahn to Zumthor; and 4D, space as an interface.|It calls for a Dimensional Escape from container to interface through three methods (the Sentient System, the Spatial Narrative and the Phygital Lens) and four rules set beside Vitruvius, Le Corbusier and Frampton: sensory field, interactive narrative, information stacking, implanted infrastructure."},
  fr:{t:"Escape Dimension Manifesto",ctx:"Manifeste · Université de Melbourne",d:"Nos esprits circulent dans le cloud tandis que nos corps restent dans des contenants statiques de béton, de verre et d’acier. L’architecture est enfermée dans une prison tridimensionnelle de sa propre fabrication.|Le manifeste lit l’architecture en quatre dimensions : 1D, l’abri qui ne fait que survivre ; 2D, le plan qui ordonne le pouvoir et le mouvement ; 3D, le vaisseau d’expérience, de Kahn à Zumthor ; 4D, l’espace comme interface.|Il appelle à une évasion dimensionnelle, du contenant vers l’interface, par trois méthodes (le système sensible, le récit spatial, la lentille phygitale) et quatre règles posées face à Vitruve, Le Corbusier et Frampton : champ sensoriel, récit interactif, superposition d’informations, infrastructure implantée."},
  zh:{t:"Escape Dimension Manifesto",ctx:"宣言 · 墨尔本大学",d:"我们的思维以光速游走于云端，身体却被困在混凝土、玻璃与钢构成的静态容器里。建筑被困在自己建造的三维牢笼之中。|宣言把建筑分为四个维度：1D，只为生存的庇护所；2D，以平面规训权力与动线的秩序；3D，从康到卒姆托的体验容器；4D，作为界面的空间。|它呼吁一场「维度逃逸」：从容器走向界面。方法有三，感知系统、空间叙事与虚实融合之镜；并对照维特鲁威、柯布西耶与弗兰姆普敦，提出四条原则：感官场域、交互叙事、信息叠加、植入式基础设施。"},
  uy:{t:"Escape Dimension Manifesto",ctx:"Bayannama · Mélburn Uniwérsitéti",d:"Ongimiz bulutta yoruq tézlikide kézidu, bedinimiz bolsa béton, eynek we polattin yasalghan turghun qachilarda qalidu. Binakarliq özi yasighan üch ölchemlik zindanda qamaqta qalghan.|Bayannama binakarliqni töt ölchemde oquydu: 1D, peqet hayat qélish üchünla bolghan bashpana; 2D, hoquq we herketni tertipleydighan pilan; 3D, Kahndin Zumthorghiche bolghan kechürme qachisi; 4D, arayüz süpitidiki boshluq.|U qachidin arayüzge qarap «ölchem qéchishi»gha chaqiridu: üch usul (sezgür sistéma, boshluq hékayisi, réal-reqemlik eynek) we Witruwiy, Le Korbuzyé hem Frampton bilen sélishturulghan töt qa'ide: sezgü meydani, öz'ara tesirlik hékaye, uchur qatlamliri, singdürülgen ul eslihe."}},

const XG=g=>X.filter(x=>x.g===g);
const pad=n=>String(n).padStart(2,"0");

function drawExtra(t){
  const card=x=>{const d=x[L];return `<button data-x="${x.id}" aria-label="${esc(d.t)}"><div class="frame ph ${x.tone}">${x.st?`<span class="badge">${esc(t.st[x.st])}</span>`:""}</div><div class="cap"><b>${esc(d.t)}</b><span class="mute">${esc(d.type)}</span></div></button>`};
  [["current","gCurrent","nCurrent"],["studies","gStudies","nStudies"],["objects","gObjects","nObjects"]].forEach(([g,el,n])=>{$(el).innerHTML=XG(g).map(card).join("");$(n).textContent=pad(XG(g).length)});
  $("gWriting").innerHTML=XG("writing").map(x=>{const d=x[L];return `<li class="${x.minor?"minor":""}"><button aria-expanded="false" data-w="${x.id}"><span class="yr">${x.year?esc(x.year):"—"}</span><b>${esc(d.t)}</b><span class="mute ctx">${esc(d.ctx)}</span><span class="pm">+</span></button><div class="body${x.img?" withimg":""}" hidden>${x.img?`<img src="${x.img}" alt="${esc(d.t)}" loading="lazy">`:""}<div>${d.d.split("|").map(p=>`<p>${esc(p)}</p>`).join("")}</div></div></li>`}).join("");
  $("nWriting").textContent=pad(XG("writing").length);
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-x]");if(b){location.hash="x-"+b.dataset.x;return}
  const w=e.target.closest("[data-w]");if(w){const body=w.nextElementSibling,open=body.hidden;body.hidden=!open;w.setAttribute("aria-expanded",open);w.querySelector(".pm").textContent=open?"−":"+"}
});

/* lightbox for secondary work */
let lbReturn=null;
function openLB(id){
  const x=X.find(i=>i.id===id);if(!x)return;const t=T[L],d=x[L];
  const meta=[[t.yr,x.year?esc(x.year):tbc(t)],[t.cat,esc(d.type)],[t.who,x.au?esc(t.au[x.au]):tbc(t)]];
  if(x.inst)meta.push([t.tbInst,esc(x.inst)]);if(x.st)meta.push([t.sStat,esc(t.st[x.st])]);
  $("lb").innerHTML=`<div class="in"><div class="top"><span class="mute">${esc(t[{current:"secCurrent",practice:"secPractice",studies:"secStudies",objects:"secObjects"}[x.g]])}</span><button class="x" id="lbx">${esc(t.close)} ✕</button></div>
    ${ph(x.id,"big",t.ph+" 01")}<div class="pair">${ph(x.id,"",t.ph+" 02")}${ph(x.id,"",t.ph+" 03")}</div>
    <div class="txt"><div><h2>${esc(d.t)}</h2><div class="meta">${meta.map(([k,v])=>`<div><div class="mute">${esc(k)}</div>${v}</div>`).join("")}</div></div><div><p>${esc(d.d)}</p></div></div></div>`;
  $("lb").hidden=false;$("lb").scrollTop=0;document.body.classList.add("lock");$("lbx").focus();
  $("lbx").onclick=closeLB;
}
function closeLB(){if($("lb").hidden)return;$("lb").hidden=true;document.body.classList.remove("lock");const g=X.find(i=>"x-"+i.id===location.hash.slice(1));history.replaceState(null,"","#"+(g?g.g:"work"));}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeLB()});
/* ph() looks up the main-project tone table; extend it for secondary items */
X.forEach(x=>{if(x.tone)META[x.id]={tone:x.tone}});

/* grouped left index */
function drawIndex(t){
  const main=P.map(p=>{const d=p[L],m=META[p.id];return `<li><a href="#${p.id}" data-id="${p.id}"><b>${esc(d.t)}</b><span class="j">${m.year?esc(m.year):esc(t.tbc)} · ${esc(d.type)} · ${m.au?esc(t.au[m.au]):esc(t.tbc)}</span></a></li>`}).join("");
  const sec=g=>XG(g).map(x=>{const d=x[L];return `<li><a href="#x-${x.id}"><b>${esc(d.t)}</b><span class="j">${x.year?esc(x.year):esc(t.tbc)} · ${esc(d.type||d.ctx)}${x.au?" · "+esc(t.au[x.au]):""}${x.st?" · "+esc(t.st[x.st]):""}</span></a></li>`}).join("");
  $("idxList").outerHTML=`<div id="idxList"><h4>${esc(t.secSelected)}</h4><ol>${main}</ol><h4>${esc(t.secCurrent)}</h4><ol>${sec("current")}</ol><h4>${esc(t.secStudies)}</h4><ol>${sec("studies")}</ol><h4>${esc(t.secObjects)}</h4><ol>${sec("objects")}</ol></div>`;
  $("idxBack").textContent="← "+t.back;
}
function markCurrent(id){document.querySelectorAll("#idxList a[data-id]").forEach(a=>a.setAttribute("aria-current",a.dataset.id===id))}

function render(){
  const t=T[L];
  document.documentElement.lang={en:"en",fr:"fr",zh:"zh-Hans",uy:"ug-Latn"}[L];
  document.querySelectorAll("[data-t]").forEach(el=>{const k=el.dataset.t;if(typeof t[k]==="string")el.textContent=t[k]});
  document.querySelectorAll(".langs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===L));
  home(t);drawExtra(t);drawIndex(t);
  if(!$("detail").hidden){const first=$("stream").querySelector("article");if(first)openStream(first.dataset.id)}
  if(!$("lb").hidden){const id=location.hash.slice(3);openLB(id)}
}
function route(){
  const h=location.hash.slice(1),isP=P.some(p=>p.id===h),isX=h.startsWith("x-")&&X.some(x=>"x-"+x.id===h);
  $("home").hidden=isP;$("detail").hidden=!isP;$("slider").hidden=isP;
  document.body.classList.toggle("home",!isP);
  idx.classList.remove("open");
  if(isX){openLB(h.slice(2));onScroll();return}
  if(!$("lb").hidden){$("lb").hidden=true;document.body.classList.remove("lock")}
  if(isP)openStream(h);
  else{const el=h&&$(h);el?el.scrollIntoView():window.scrollTo(0,0)}
  onScroll();
}

kashgar:{meta:[["Year","2023 · Feb–Jun"],["Location","Kashgar, Xinjiang, China"],["Context","Fifth year, B.Arch, Tianjin University"],["Authorship","Academic · individual"]],
 intro:["Kashgar’s ancient city, with its high terrace dwellings, holds a unique place among China’s high-density habitats. The spatial design, shaped by environment, customs and building techniques, reflects strong humanistic sentiment; the seemingly chaotic yet orderly streets and alleys weave a vibrant public life. Yet the new Kashgar is veering toward a “ghost city,” where high rises replace rich spiritual memories.","The project seeks to protect not only the buildings, but the carrier of culture and the way of life within it: to bridge the boundary of culture and the boundary of time in a new way, writing a fresh chapter for Kashgar."],
 S:[
 {part:"Context",h:"Problems",t:["Despite the stagnant growth in China’s urbanisation rate, the wave of China’s real estate industry is still sweeping the country’s forefront. The boundaries of the city of Kashgar are so clearly divided. This clearly presents a collision of two civilisations and ideas, behind which is the successful reproduction of Le Corbusier’s Ville Radieuse."],
  f:[["KSG-02","Origin of the form of the city of Kashgar: from the capital of the Shule Kingdom (2nd c. BC) and Islam as state religion (960) to the Ville Radieuse (1920) and China’s real estate era (1998–2018).","full"]]},
 {part:"Research",h:"Space syntax and field research",
  lead:"Space syntax reads a city as a network of connected spaces rather than a collection of buildings.",
  t:["Developed by Bill Hillier and Julienne Hanson at University College London (The Social Logic of Space, 1984), the method reduces streets to an axial map: the fewest and longest lines of sight and movement that cover every public space. Each line is then measured by how many changes of direction it takes to reach every other line.","Integration describes how shallow a street is to the whole system; highly integrated streets are where strangers pass and trade happens. Connectivity counts a street’s direct neighbours, and choice measures how often it lies on the shortest route between others. Depth, the number of turns away from the through street, tracks how private a space becomes. In Kashgar’s old city, “the more turns the node has, the deeper and more private it becomes.”"],
  bgNote:true},
 {h:"Field research",t:["The project involved on-site investigation of over 100 spatial nodes across the old city, revealing three distinct qualities: the hierarchy of roads, micro plaza spaces, and dwellings scattered by terrain elevation. Three road types, through roads, loop roads and dead ends, progressively intensify to define layers of private neighbourhood space; the site, the commercial street and the intervention of the modern city nest within one another in successive rings."],
  f:[["KSG-03","Summary of venue research: bridge arcades, accessible and gated entrances, steps, shops, tertiary and internal circular roads, display street, public and government buildings, mosques.","half"],["KSG-04","Field photographs of the surveyed nodes.","full"]]},
 {h:"Bloodline logic and street evolution",t:["This hierarchy is not accidental. As with other naturally grown villages in China, the basic form of Kashgar’s old city settlement is shaped by “spatial” relationships derived from clan bloodlines. As family populations grew, the old city expanded; streets were preserved, and became a second living room for people."],
  f:[["KSG-05","Following the terrain, a single household, the child grows, street formation; courtyards, mosque and gathering square, rooftop terraces, children raised in the streets.","full"]]},
 {h:"Walkable city research",t:["Comparing walkability across cities, Paris (intricate) and Barcelona (a regular grid) achieve comparable comfort despite their differing forms, both balancing practicality with a sense of interest, a quality shared by the old city’s streets."],
  f:[["KSG-06","Commute time by walking for students, workers and freelancers, and comfort, practicality, fun, safety and walkability scores for Anyang, Cairo-Giza, Urumqi, Erbil, Paris and Barcelona.","full"]]},
 {part:"Planning",h:"Walkable urban theory",t:["This spatial logic, grown organically from bloodline relationships, aligns closely with contemporary walkable city theory. The streets themselves offer nearly a third of the time and space that can be lived outdoors, forming a lag space between the residential and the urban. The project draws on Jeff Speck’s theory in The Walkable City, accommodating car circulation, bike loops and the random walk of people to create walkable neighbourhoods."],
  plan:{base:"KSG-07",cap:"The process of urban formation and common spatial places in Kashgar.",pts:[
   {x:.10,y:.52,code:"KSG-09",h:"Transitional open environments with urban boundaries"},
   {x:.72,y:.80,code:"KSG-10",h:"Highly private environment in the neighbourhood"}]}},
 {h:"The logic of community formation",t:["Original location: how should older buildings respond to development? Real estate endings: a possible modern residential plan, not built yet. Space syntax: borrowing the integration of the street. New road network: building roads and tearing down homes.","Stage 1, cradle: modularity, old houses iterating on each other, the emergence of commercial one-unit housing. Stage 2, enclosure: the commercial street is completed and multi-storey residential areas are planned. Stage 3, balance: functional zoning of each lot is clearly defined and multi-storey buildings rise. Stage 4, saturation: continuing extensions must account for spacing and shape so they can be built according to demand."],
  f:[["KSG-08","The logic of community formation, in eight steps.","full"]]},
 {h:"Double diamond model",t:["A diamond model was used to locate points of optimisation: strengthening functionality so that zones become nodes and comfortable spaces, with shops acting as a buffer between community and residence. The project ultimately aims at a community structure that draws neighbours closer, realised through multiple 5m by 5m unit blocks that also incorporate terrain elevation as a variable, translated into a system of staggered floor slabs and split-level daylighting within the building."],
  f:[["KSG-13","Double diamond model pushed to logic: problems, cluster topics, planning structure, resolution.","full"],["KSG-12","Frames conforming to different height differences (5m × 5m).","half"]]},
 {part:"Building",h:"Plan and views",t:["Second floor plan. A entrance platform, B lobby lounge, C resting corner, D billiard area, E badminton area, F staircase and elevator, G lobby, H table tennis area, I greenway area, J fitness area, K balcony, L connecting corridor."],
  plan:{base:"KSG-11",cap:"2nd floor plan. Viewpoints are approximate.",pts:[

   {x:.22,y:.66,code:"KSG-16",h:"Terrace front and corridor",d:"View along the building’s side corridor, where staggered floor slabs provide ample daylight and space for casual gathering while protecting residents’ privacy."}]}},
 {h:"Spatial operations",t:["To preserve residents’ cultural inertia and create a variety of interior spaces, the project adopts an open structure. The main body uses a cantilevered system of thick beams and double wings; floor slabs are suspended in a bold departure from conventional storey logic, forming a suspension system at every 28m span. This strategy retains spatial freedom, giving public areas greater permeability while bringing neighbours closer together."],

"sensory-stock":{meta:[["Year","2026 · Feb–Jun"],["Location","Lakeside Terrace, Barbican Estate, London"],["Context","Second year, M.Arch, University of Melbourne"],["Authorship","Academic · individual"]],
 intro:["Three traders cut vertically through the Barbican as tunnel volumes, basement to workshop, each in their own material world: lime plaster, bent timber, cold steel. You are what you eat. Your knife is what you pick. This is a wonderland for discovering who you are.","The project is sited within the Barbican Centre, inserting three independent shops, 89 Lime (perfumery), Curios (umbrellas) and 500 Knives (knife specialist), cutting vertically from the basement auction hall to the ground-level workshops. Though the three trade in different goods, they share the same relationship: made, sold, maintained, passed on.","These three products are not chosen for utility. The scent you wear, the object you carry in the rain, the blade you keep for life: each carries a strong personal identity, and each begins with the hand. What can a shop space offer a person, beyond selling? Sensory Stock answers through sensory guidance and human behaviour. Made. Sold. Maintained. Passed on."],
 S:[
 {part:"Context",h:"Background",t:["The three shops are drawn from “Independent London,” each closely tied to daily life, spanning a spectrum from social settings to private, personal moments. More importantly, all three carry a distinctive, bespoke, heritage making process: this is why making and circulation become the most significant spaces for display and participation in the project. Above ground sits the workshop, where making happens; below ground sits the auction hall, where the maker’s finest pieces, residents’ inherited collections and customers’ own creations re-enter circulation. The building becomes a full life cycle of the object."],
  list:[["Curios · sticks & umbrellas","Formerly James Smith & Sons, founded in 1830, a fifth-generation umbrella workshop, its bell ringing three times a day: the origin of the project’s “three bell ritual.”"],["Two Hundred Knives · knife specialist","Sourced directly from Japanese blade smiths, its 200-plus knives form a material archive, each one a tool to be touched and used, not a specimen behind glass."],["89 Lime · family-run perfumers","Formerly Floris, a nine-generation family-run perfumery still using its original 18th-century formula books; scent becomes a time machine, the fragrance you choose determining how the world remembers you."]],
  f:[["SNS-02","The objects of the three trades.","tall"]]},
 {h:"Display strategy",t:["The three products correspond to three degrees of human distance. 89 Lime at social distance, scent before sight. Curios at shoulder-to-shoulder distance, touching a handle as shared shelter. 500 Knives at intimate distance, close observation as trust. Purchasing becomes a sensory dialogue, not a simple transaction."],
  f:[["SNS-03","Encounter, company, intimacy; memory, relationship, discipline.","full"]]},
 {h:"Program composition",t:["The three shops sit along one axis, privacy increasing inward. Daylight shifts from exterior-reliant to volume-specific. Thick walls hold darkened chambers, doubling as display space. Each volume connects workshop above to auction hall below, a complete cycle of making, selling, circulation."],
  f:[["SNS-04","Hierarchy, stocking and display, geometry.","full"]]},
 {part:"Building",h:"Materials, old and new structure",t:["Above ground, new construction: lightweight steel columns, polished concrete and timber. Each volume’s light responds to its privacy. The Scent Well, outermost, brightest, scent dispersing in full light. The Rain Cloister, centred, its glass deck drawing rain and daylight into the workshop below. The Slit of Light, innermost, most enclosed, light catching along the blade’s edge as its only source. Panels echo this: vertical rib, angled baffle, interlocking recess.","Below ground, original brick and concrete are preserved, lit through curtain wall and west light well. Old and new layered together, making holds memory. Openings between volumes are framed views: commercial behaviour and craftsmanship, same frame."],
  f:[["SNS-05","Exploded axonometric.","half"],["SNS-06","Model, basement and ground floor.","half"]]},
 {h:"Sequence of moments",list:[["A · Bridge and auction space","A long bridge offers first sight of the auction space below, the city fading as the journey turns inward."],["B · Beyond the light towers","Staggered light towers and hands-on workbenches turn the workshop into a montage of making."],["C · Immersive memory field","Scent guides you through the Scent Well like a compass, the space glowing like a garden."],["D · Intimate ritual of choice","A ten-metre light well anchors the umbrella warehouse, where you pull each one like a sword, testing weight and intimacy."],["E · The sacred tension of craft","Five hundred knives line a ten-metre wall, their cold precision drawing the eye up in quiet reverence."]],
  f:[["SNS-07","Ground floor plan.","half"],["SNS-08","Basement plan.","half"],["SNS-09","Stocking and display cabinet.","half"],["SNS-10","Section.","half"]]},
 {h:"The slit of light",t:["A crack splits the ground, ten metres long and no wider than one metre. Light seeps up from the depths of the crack. The walls are uneven, a rough version of a town carved into the fissure of a whetstone. Customers retrieve knives from the basement, while employees work quietly above ground. Knives and the sound of sharpening shuttle up and down through this slit.","You place the knife on the lifting device. It slowly rises, passes through the cracks, passes through the light, and disappears into the ground. Light comes from a skylight above, reflects off metal, then scatters onto brick walls. The tone is cold, but not harsh."],
  f:[["SNS-11","Open structure, sectional perspective: smell and sound, skylight, timber flooring.","full"],["SNS-01","Model, top view.","half"]]}
 ]},

"tieniu-roof":{meta:[["Year","2021 · Sep–Oct"],["Location","Tieniu Village, Xilai Township, Pujiang County"],["Context","Fourth year, B.Arch, Tianjin University"],["Authorship","Academic study · individual"]],
 intro:["The root of rural architecture lies in the most primitive needs of the human being, reflecting a human centredness and a home system that each person builds independently: the most fundamental point of difference between the city and the countryside. The project occupies a former elderly service centre for the village, long abandoned; combined with an early village walking route plan, the site has been reclaimed as an entry landmark for Tieniu Village, bringing together an iron smelting experience, an activity space and an important teahouse for rest.","John F. C. Turner’s theory suggests a mutual constraint between architecture, people and nature, forming a stable, comfortable environment. Turner believed a sketch is enough for architectural drawings, leaving room for improvisation. Drawings do not decide; only people standing on site can give architecture its most reasonable form."],
 S:[
 {part:"Context",h:"History of iron smelting culture",t:["Tieniu Village’s iron smelting history dates to the Warring States period. Archaeologists uncovered a piece of iron resembling a resting ox, the origin of the village’s name, “iron ox.” Several universities have since replicated the ancient smelting process here for teaching purposes."],
  f:[["TBR-02","History of iron smelting culture.","full"]]},
 {h:"Iron village general plan",t:["The site sits within a rural setting rich in history and landscape. Early plans set out a medium loop connecting key village sites for residents, fitness seekers and nature explorers, alongside a smaller accessible route. Both link existing landscape resources. The site itself acts as a staging post for village memory, the starting point of the tour."],
  f:[["TBR-03","Iron village general plan: community tourism route, village walking system, spatial nodes for trail installations.","full"]]},
 {part:"Process",h:"Villagers’ co-construction",list:[["01 · Original condition",""],["02 · Demolition parts","The original structure was a shear-wall structure with no weighing columns."],["03 · Creating a new structure","The load-bearing structure is made of timber from an orchard owned by the village of Iron Ox. The structure is separated from the walls and draws on Chinese column-and-tie-beam construction."],["04 · Addition","New navigational routes and bathroom features create a better connection to the plaza and enhance the public nature of the fruit orchard."],["05 · Iron smelting","Placing iron smelting activities in the site’s Blast Furnace Plaza incorporates the historical memory of Iron Ox Village."],["06 · Casting tiles","Iron tiles can be used not only for roofing, but can also be arranged and combined at will to create walls and windows of different realities, filling the windows of the original building and transforming the connection between interior and exterior."],["07 · Putting tiles",""],["08 · Building a house",""]],
  f:[["TBR-04","Villagers’ co-construction, from original condition to building a house.","tall"]]},
 {part:"Building",h:"Constraints and opportunities",t:["The local authority required rebuilding in situ, without extension. Yet the original structure was in fact quite new; the project sought a more economical way to open it toward the surrounding nature and village."],
  f:[["TBR-05","General layout: fish ponds, artificial diversion canal, wastewater purification tanks, iron smelting tower, sunken gazebo, rainwater garden, main road, community tourism route, village walking system.","half"],["TBR-06","Ground floor plan.","half"]]},
 {h:"Roof, eaves and low-energy design",t:["The eave regulates both daylight and thermal comfort, forming a double roof where openings between layers filter light without excess heat. As tiles accumulate over time, dappled light gradually fills the interior.","In summer, doors open to the teahouse, cooling the eave space and circulating moisture. Rainwater collects in the smelting cooling pool for reuse, tying the project’s water back into the furnace it feeds."],
  f:[["TBR-08","Section: roofs, eaves and low-energy design.","full"],["TBR-07","New structural details.","full"]]},
 {h:"Views",f:[["TBR-09","Under-eave deck.","half"],["TBR-10","Outdoor corridor.","half"],["TBR-01","Model.","half"]]}
 ]},

const figHTML=([c,cap,size])=>`<figure class="pf ${size||"full"}"><img src="${IMG(c)}" alt="${esc(cap||c)}" loading="lazy"><figcaption><span>${esc(cap||"")}</span><code>${c}</code></figcaption></figure>`;
function planHTML(pl,uid){
  const first=pl.pts[0];
  return `${uid==="kxplan"?"":`<div class="ia"><span class="ia-dot"></span><b>${L==="zh"?"可交互":"Interactive"}</b>${L==="zh"?"点击平面上的数字点位，查看对应的效果图。":"Click the numbered points on the plan to see each view."}</div>`}<div class="planview" data-pv="${uid}">
   <div class="pv-plan"><div class="rel"><img src="${IMG(pl.base)}" alt="${esc(pl.cap)}" loading="lazy">${pl.pts.map((p,i)=>`<button class="pv-dot${i===0?" on":""}" style="left:${p.x*100}%;top:${p.y*100}%" data-i="${i}" aria-label="${esc(p.h)}">${i+1}</button>`).join("")}</div>
     <div class="pv-cap"><span>${esc(pl.cap)}</span><code>${pl.base}</code></div></div>
   <div class="pv-view">${pl.pts.map((p,i)=>`<figure class="pv-item"${i?" hidden":""}><img src="${IMG(p.code)}" alt="${esc(p.h)}" loading="lazy"><figcaption><b>${i+1} · ${esc(p.h)}</b>${p.d?`<span>${esc(p.d)}</span>`:""}<code>${p.code}</code></figcaption></figure>`).join("")}
     <p class="pv-hint">${esc(T[L].tapView)}</p></div></div>`;
}
document.addEventListener("click",e=>{
  const d=e.target.closest(".pv-dot");if(!d)return;
  const pv=d.closest(".planview"),i=+d.dataset.i;
  pv.querySelectorAll(".pv-dot").forEach(x=>x.classList.toggle("on",x===d));
  pv.querySelectorAll(".pv-item").forEach((x,k)=>x.hidden=k!==i);
});
let pvId=0;
article=function(p,t,k){
  const d=p[L],c=PC[p.id],m=META[p.id];
  if(!c)return "";
  const note=L!=="en"?`<p class="pnote">${esc(t.projNote)}</p>`:"";
  const sec=s=>`<section class="psec${s.part?" haspart":""}${s.gallery?" pgal":""}">${s.part?`<div class="ppart">${esc(s.part)}</div>`:""}${s.h?`<h2 class="ph2">${esc(s.h)}</h2>`:""}
     ${s.lead?`<p class="plead">${esc(s.lead)}</p>`:""}
     ${(s.t||[]).map(x=>`<p class="ptxt">${esc(x)}</p>`).join("")}
     ${s.list?`<dl class="plist">${s.list.map(([a,b])=>`<div><dt>${esc(a)}</dt>${b?`<dd>${esc(b)}</dd>`:""}</div>`).join("")}</dl>`:""}
     ${s.plan?planHTML(s.plan,"pv"+(pvId++)):""}
     ${s.f?`<div class="pfigs">${s.f.map(x=>figHTML(s.f.length===1&&x[2]==="tall"?[x[0],x[1],"tall solo"]:x)).join("")}</div>`:""}</section>`;
  const hero=PIMG[p.id];
  return `<article data-id="${p.id}" id="s-${k}" class="proj">
    <figure class="phero${hero.fit?" fit":""}"><img src="${IMG(hero.hero)}" alt="${esc(d.t)}"><figcaption><code>${hero.hero}</code></figcaption></figure>
    <div class="phead"><div class="pnum">${String(P.indexOf(p)+1).padStart(2,"0")}</div><h1>${esc(d.t)}</h1>${note}
      <dl class="pmeta">${c.meta.map(([a,b])=>`<div><dt>${esc(a)}</dt><dd>${esc(b)}</dd></div>`).join("")}</dl></div>
    <div class="pintro${c.introSmall?" small":""}">${c.intro.map((x,i)=>`<p class="${i===0&&!c.introSmall?"first":""}">${esc(x)}</p>`).join("")}</div>
    ${c.S.map(sec).join("")}
  </article>`;
};

const EBD=[1,2,2,39,38,74,23,37,37,36,44,9,11],EBG=[[0,2],[3,4],[5,5],[6,6],[7,12]];
function ebChart(){const n=EBD.length,rh=22,W=220,top=8,mx=74,bx=42,bw=W-bx-44;
 const bars=EBD.map((v,i)=>{const y=top+i*rh,w=v/mx*bw;return `<line x1="${bx}" y1="${y+rh/2}" x2="${bx+w}" y2="${y+rh/2}" class="ebc-b"/><text x="${bx-8}" y="${y+rh/2+3}" class="ebc-y">${1780+i*10}s</text>`}).join("");
 const pts=EBD.map((v,i)=>[bx+v/mx*bw,top+i*rh+rh/2]);let d=`M${pts[0][0]},${pts[0][1]}`;for(let i=1;i<pts.length;i++){const p=pts[i-1],q=pts[i],my=(p[1]+q[1])/2;d+=` C${p[0]},${my} ${q[0]},${my} ${q[0]},${q[1]}`}
 const grp=EBG.map(([a,b],k)=>{const y1=top+a*rh+3,y2=top+(b+1)*rh-3,x=W-30;return `<path d="M${x},${y1} h6 v${y2-y1} h-6" class="ebc-g"/><text x="${x+12}" y="${(y1+y2)/2+3}" class="ebc-n">${k+1}</text>`}).join("");
 return `<figure class="sf eb-chart"><svg viewBox="0 0 ${W} ${top*2+n*rh}" role="img" aria-label="Massacres per decade, grouped into five platforms">${bars}<path d="${d}" class="ebc-l"/>${grp}</svg><figcaption><span>Massacres per decade, 1780s–1900s, grouped into the five platforms.</span><code>EB-12</code></figcaption></figure>`}

  SLX("Concept","Gathering by the water",["Water and its sources recur across the engagement and are a common thread through Indigenous Australian cultures. Beyond the shared grief over the Frontier Wars, the design makes water its central motif. The pool in the excavation recalls the rain-filled hollows of quarries, but above all it is a symbolic source for retracing cultural memory: an experience of seeking where the dreaming begins.","The spatial sequence recreates the practice of gathering by the water. Visitors are drawn toward a sunken, magnetic core that stands for historical gathering sites. But the water here is absent or ephemeral, turning a scene of joyful gathering into one of loss and reflection."],ZOOM("EB-14","Big idea: read the terrain, read the history. The Shrine’s story above; the billabong below.","I"),"",{ia:ZIA()}),

  SLX("Experience","Close reading",["Rock art can be seen from a distance, but reading it truly means approaching the water. The descriptions of the permanent exhibits are etched into the granite bed of the pool. To read them you must come close, even bow your head, and use your body to block the glare. Lowering the head, leaning towards the water, straining to decipher: the act itself is a ritual of mourning.","Along the way, geological layers rise on your left, community rock art appears through openings above, and the shadows of people move faintly behind mesh screens like fragments of memory. You have to move to piece things together."],FC("EB-08","Reading at the water’s edge.","I","big"),"eb-close"),

const LOPS=[
 ["Bending and pressing","Geometry through controlled force",["LMP-B1","LMP-B2"],"A press brake gives controlled bends at repeatable angles; a printed profile sets a specific angle, and a mould presses sheet into more specific forms. Internal supports must follow the direction of force to avoid unwanted deformation."],
 ["U profile","Curvature",["LMP-U1","LMP-U3"],"The same curve in aluminium, brass, galvanised and mild steel showed different rigidity, spring-back and surface. Repeated, it became a simple reflector: as the light moved, each curve concentrated highlight and shadow differently."],
 ["Fold","Angle controls light direction",["LMP-F1"],"A sharp fold makes two directional surfaces from one sheet. The angle sets both the direction of reflection and the depth of shadow; repeated, a fold becomes a system for directing light."],
 ["Hammering","From reflection to scattering",["LMP-H1","LMP-07"],"Hammering breaks a flat mirror into many small facets, so light scatters into many highlights instead of one. Texture and form develop at the same time."],
 ["Polishing","Surface finish as an optical variable",["LMP-P2","LMP-PL1"],"From 36 grit to 80–120 grit: coarse finishes keep directional marks, fine ones give a continuous reflection. Direction matters as much as intensity; parallel strokes hold a highlight, crossed or rotated strokes fragment it."],
 ["Polishing direction","Crossed, doubled, irregular, radial",["LMP-11"],"Changing the direction of abrasion gives the same sheet controlled, radial or fragmented reflections."],
 ["Heat","Colour through material reaction",["LMP-08","LMP-O2"],"Heating mild steel brought out gold, brown, blue and dark areas according to the heat. Colour is not applied as a coating; it is a direct result of the process."],
